<style>
/* Layout: caderno de campo — cabeçalho com abas, cada aba é uma ferramenta; resumo antes do detalhe. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#17211B; --muted:#5B685F; --line:#D5DCD3;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DFEDE4;
  --good:#2B7A4B; --good-soft:#DDF0E3; --warn:#9A6512; --warn-soft:#F8ECD3; --bad:#AE3434; --bad-soft:#F8DEDC;
  --fem:#8A4F7D; --mal:#2F5F8A;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201B; --surface-2:#1E2822; --ink:#E4EBE6; --muted:#97A59C; --line:#2C3830;
  --accent:#72C097; --accent-ink:#0D1510; --accent-soft:#1F3428;
  --good:#6FCF97; --good-soft:#1C3326; --warn:#E3B45C; --warn-soft:#3A2F17; --bad:#F08A84; --bad-soft:#3D1F1E;
  --fem:#D69BC8; --mal:#8DB8E0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --surface-2:#1E2822; --ink:#E4EBE6; --muted:#97A59C; --line:#2C3830;
  --accent:#72C097; --accent-ink:#0D1510; --accent-soft:#1F3428;
  --good:#6FCF97; --good-soft:#1C3326; --warn:#E3B45C; --warn-soft:#3A2F17; --bad:#F08A84; --bad-soft:#3D1F1E;
  --fem:#D69BC8; --mal:#8DB8E0; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(180deg,#1F4D38 0%,#183E2D 100%);color:#F6F1E4;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 12px rgba(10,30,20,.18)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0}
.brand .farm{color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}

main{padding-block:20px 60px}

h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 8px;letter-spacing:.01em}
p{margin:0 0 8px}
.lead{color:var(--muted);max-width:68ch;margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.btn{font:inherit;font-weight:600;font-size:14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.fix{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fix:first-child{border-top:0}

.fix .stripe.bad{background:var(--bad)} .fix .stripe.warn{background:var(--warn)}

.src{font-size:12px;color:var(--muted)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 12px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-back{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:760px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal .actions .left{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30;font-size:14px;max-width:90vw}
.empty{padding:24px;text-align:center;color:var(--muted)}
.agenda-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.agenda-item:first-child{border-top:0}
.ref{padding:12px 0;border-top:1px solid var(--line)}
.ref:first-child{border-top:0}
.ref a{color:var(--accent);font-weight:600}
a{color:var(--accent)}
.reasons{margin:4px 0 0;padding-left:18px;font-size:13px}
.reasons li{margin-bottom:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}

.seg button:first-child{border-left:0}

.res-ok{background:var(--good-soft);border-radius:8px;padding:10px 12px}

.task{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line)}

.task label{display:flex;flex-direction:column;gap:2px;cursor:pointer}

.dtask{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 4px 9px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--line)}
.dtask.k-bad{border-left-color:var(--bad)} .dtask.k-warn{border-left-color:var(--warn)} .dtask.k-ok{border-left-color:var(--good)}
.dtask .when{font-size:13px;color:var(--muted);min-width:56px;font-variant-numeric:tabular-nums}
.dtask .what{min-width:0;overflow-wrap:anywhere} .dtask .t{font-weight:600}
.grp-h{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard.done{opacity:.6;background:var(--surface-2)}
.tcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.tcard li span:last-child{font-variant-numeric:tabular-nums}
.check{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.check[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent)}
.seplist{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:0 24px}
.seplist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.seplist b{font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.cmsbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cmsbox label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
details summary{cursor:pointer}
td input{width:76px}
td input.wide{width:150px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr));gap:10px}
.qbtn{font:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:74px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:left;cursor:pointer}
.qbtn:hover{background:var(--accent-soft)} .qbtn:active{transform:scale(.98)}
.qbtn b{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15}
.qbtn span{font-size:13px;color:var(--muted)}
.q-good{border-left-color:var(--good)} .q-warn{border-left-color:var(--warn)} .q-bad{border-left-color:var(--bad)} .q-info{border-left-color:var(--mal)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.animal-chips{max-height:34vh;overflow:auto;padding:2px}
.gr{flex-wrap:nowrap;gap:4px}

.gr .g3[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.gr .g4[aria-pressed="true"],.gr .g5[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.lbl{font-weight:600;font-size:14px;margin:12px 0 6px}
.big-input{font-size:22px!important;padding:10px 12px!important}
.crias{display:grid;gap:10px;margin-top:12px}

.cria>b{grid-column:1/-1;font-family:var(--f-display);font-size:16px}
label.inline{display:flex;gap:6px;align-items:center;font-size:14px;min-height:40px}

.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.money>div{display:flex;flex-direction:column;gap:2px}
.money .l{font-size:13px;color:var(--muted)} .money b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}

nav.tabs .mais{color:var(--accent)}
nav.tabs.sub{border-top:1px solid var(--line)}

.toast .undo{font:inherit;font-weight:700;background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;margin-left:8px;cursor:pointer}
main{padding-bottom:110px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* ===== Identidade visual: logo, cabeçalho verde, sol do sertão ===== */
:root{--sun:#E9A43C;--brand:#1F4D38;--brand-2:#183E2D;--shadow:0 1px 2px rgba(23,33,27,.05),0 6px 18px rgba(23,33,27,.05)}
body{background:var(--bg)}
.brand{align-items:center;gap:12px;padding-block:12px 8px}

.brand .bt{display:flex;flex-direction:column;line-height:1}
.brand h1{color:#FBF6EA;font-size:27px;letter-spacing:.015em}
.brand h1 span{color:var(--sun)}
.brand .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#BFD3C6;margin-top:3px}
.brand .farm{color:#DCE7DF;font-size:14px;padding:3px 10px;border:1px solid rgba(246,241,228,.22);border-radius:999px}

/* ===================== Estado e armazenamento ===================== */
const CONFIG_PADRAO={nome:"",chuvosos:[1,2,3,4],idadeDesm:70,pesoAdulto:null,iep:8,iniciado:false};
let S={animais:[],pesagens:[],caixa:[],sanidade:[],tarefas:{feitos:{}},config:{...CONFIG_PADRAO},racao:{ingredientes:null}};
let MODE="demo"; // demo | db | local
let DB=null;
const KEYS=["animais","pesagens","caixa","sanidade","config","racao","tarefas"];
const writing={},pendingWrite={};
let ui={tab:"painel",filtroStatus:"ativo",filtroCat:"",busca:"",mesCaixa:iso(HOJE).slice(0,7),racaoRes:null,racaoFase:"term180",racaoQtd:20};
ui.tab="hoje";

function bodyOf(k){return k==="config"?S.config:k==="racao"?S.racao:k==="tarefas"?S.tarefas:{items:S[k]}}
/* ===== Offline primeiro: tudo é gravado no aparelho e enviado à nuvem quando houver internet ===== */
function cacheGet(k){try{return JSON.parse(localStorage.getItem("cn_cache_"+k)||"null")}catch(e){return null}}
function cacheSet(k){try{localStorage.setItem("cn_cache_"+k,JSON.stringify(bodyOf(k)))}catch(e){}}
let DIRTY={};try{DIRTY=JSON.parse(localStorage.getItem("cn_dirty")||"{}")||{}}catch(e){DIRTY={}}
let ultimaSync=null;try{ultimaSync=localStorage.getItem("cn_sync")}catch(e){}
function setDirty(k,v){if(v)DIRTY[k]=Date.now();else delete DIRTY[k];try{localStorage.setItem("cn_dirty",JSON.stringify(DIRTY))}catch(e){}}
const nPend=()=>Object.keys(DIRTY).length;
const online=()=>navigator.onLine!==false;
function syncBadge(){
  const b=document.getElementById("sync");if(!b)return;
  if(MODE==="demo"){b.hidden=true;return}
  b.hidden=false;b.className="sync";let t;
  if(MODE==="local")t="Salvo neste aparelho";
  else if(!nPend())t="Sincronizado";
  else if(!online()||MODE==="cache"){b.classList.add("off");t=`Sem internet · ${nPend()} ${nPend()===1?"parte":"partes"} para enviar`}
  else{b.classList.add("busy");t="Sincronizando…"}
  b.textContent=t;
  b.title=MODE==="local"?"Os dados ficam só neste navegador.":nPend()?"Seus registros estão guardados no aparelho e serão enviados sozinhos quando a internet voltar. Toque para tentar agora.":"Tudo enviado para a nuvem"+(ultimaSync?" em "+new Date(+ultimaSync).toLocaleString("pt-BR"):"")+".";
}
function withTimeout(pr,ms){return Promise.race([pr,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))])}
async function persist(k){
  if(MODE==="demo")return;
  if(MODE==="local"){try{localStorage.setItem("aprisco_"+k,JSON.stringify(bodyOf(k)))}catch(e){toast("Não foi possível salvar neste navegador")}return}
  cacheSet(k);setDirty(k,true);syncBadge();
  if(MODE==="db"&&online())pushKey(k);
}
async function pushKey(k){
  if(!DB)return;
  if(writing[k]){pendingWrite[k]=true;return}
  writing[k]=true;let ok=false;syncBadge();
  try{await withTimeout(DB.doc("fazenda/"+k).set(JSON.parse(JSON.stringify(bodyOf(k)))),20000);ok=true}
  catch(e){
    if(e&&e.code==="quota_exceeded")toast("Limite de armazenamento atingido. Apague registros antigos.");
    else if(e&&e.code==="invalid_argument"){toast("Você não tem permissão para alterar estes dados.");setDirty(k,false)}
    /* sem internet ou servidor fora: fica guardado no aparelho e tenta de novo depois */
  }
  writing[k]=false;
  if(ok&&!pendingWrite[k]){setDirty(k,false);if(!nPend()){ultimaSync=String(Date.now());try{localStorage.setItem("cn_sync",ultimaSync)}catch(e){}}}
  if(pendingWrite[k]){pendingWrite[k]=false;pushKey(k)}
  syncBadge();
}
function sincronizar(){if(MODE!=="db"||!online())return;Object.keys(DIRTY).forEach(k=>{if(KEYS.includes(k))pushKey(k);else setDirty(k,false)})}
window.addEventListener("online",()=>{syncBadge();sincronizar();if(nPend())toast("Internet de volta: enviando seus registros")});
window.addEventListener("offline",()=>{syncBadge();toast("Sem internet. Pode continuar registrando: tudo fica guardado no aparelho")});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sincronizar()});
setInterval(sincronizar,30000);
function save(...ks){ks.forEach(k=>persist(k))}

async function initStore(){
  /* abre na hora com o que está guardado no aparelho, mesmo sem internet */
  let modoAnt=null;try{modoAnt=localStorage.getItem("cn_mode")}catch(e){}
  const cfg0=cacheGet("config");
  if(modoAnt==="db"&&cfg0&&cfg0.iniciado){const got={};KEYS.forEach(k=>{const v=cacheGet(k);if(v)got[k]=v});MODE="cache";applyLoaded(got);_dietasCache=null;render()}
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(db){
    DB=db;
    const got={};let done=false;
    KEYS.forEach(k=>{
      db.doc("fazenda/"+k).onSnapshot(snap=>{
        got[k]=snap.exists?snap.data():null;
        if(!done&&KEYS.every(x=>x in got)){done=true;
          if((got.config&&got.config.iniciado)||MODE==="cache"){
            const ap={};KEYS.forEach(x=>{if(!DIRTY[x]&&got[x])ap[x]=got[x]});
            MODE="db";try{localStorage.setItem("cn_mode","db")}catch(e){}
            applyLoaded(ap);Object.keys(ap).forEach(cacheSet);_dietasCache=null;render();sincronizar()}
          else{MODE="demo";render()}
          return}
        if(done&&MODE==="db"&&!writing[k]&&!DIRTY[k]&&!snap.metadata.hasPendingWrites&&got[k]){applyLoaded({[k]:got[k]});cacheSet(k);_dietasCache=null;render()}
      },err=>{});
    });
  }else if(MODE==="cache"){syncBadge()
  }else{
    let cfg=null;try{cfg=JSON.parse(localStorage.getItem("aprisco_config")||"null")}catch(e){}
    if(cfg&&cfg.iniciado){
      const got={};KEYS.forEach(k=>{try{got[k]=JSON.parse(localStorage.getItem("aprisco_"+k)||"null")}catch(e){got[k]=null}});
      MODE="local";applyLoaded(got);render();
    }else{DB=null;render()}
  }
}
function applyLoaded(got){
  for(const k of Object.keys(got)){
    const v=got[k];
    if(k==="config")S.config={...CONFIG_PADRAO,...(v||{})};
    else if(k==="tarefas")S.tarefas=v&&v.feitos?{feitos:{...v.feitos}}:{feitos:{}};
    else if(k==="racao")S.racao=v&&v.ingredientes?{ingredientes:migrarIng(v.ingredientes),mapa:v.mapa||{},cms:v.cms||{},pct:v.pct||{},lotes:Array.isArray(v.lotes)?v.lotes:[]}:{ingredientes:ingPadrao()};
    else S[k]=v&&Array.isArray(v.items)?v.items.slice():[];
  }
}
function comecarReal(){
  S={animais:[],pesagens:[],caixa:[],sanidade:[],tarefas:{feitos:{}},config:{...CONFIG_PADRAO,iniciado:true},racao:{ingredientes:ingPadrao()}};
  MODE=DB?"db":"local";if(DB)try{localStorage.setItem("cn_mode","db")}catch(e){}
  KEYS.forEach(k=>persist(k));
  ui.tab="rebanho";render();
  toast("Rebanho iniciado. Cadastre seus animais.");
}

function gerarExemplo(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
  const rr=(a,b)=>a+rnd()*(b-a);
  const A=[],P=[],C=[],SA=[];

/* ===================== Cálculos zootécnicos ===================== */
const byId=id=>S.animais.find(a=>a.id===id);
function pesagensDe(id){return S.pesagens.filter(p=>p.animal===id).sort((a,b)=>a.data<b.data?-1:1)}
function ultimo(id,campo){const ps=pesagensDe(id).filter(p=>p[campo]!=null);return ps.length?ps[ps.length-1]:null}
function criasDe(id){return S.animais.filter(a=>a.mae===id)}
function idadeEm(a,data){return dias(a.nasc,data)}
function desmIdade(){return +S.config.idadeDesm||70}
function iepDias(){return Math.round((+S.config.iep||8)*30.44)}
function categoria(a){
  const d=dias(a.nasc);
  if(d<desmIdade())return a.sexo==="F"?"Cordeira":"Cordeiro";
  if(a.sexo==="F"){if(criasDe(a.id).length||d>=730)return "Matriz";return "Borrega"}
  if(a.castrado)return "Capão";
  if(d<365)return "Borrego";
  return "Reprodutor";
}
const ativos=()=>S.animais.filter(a=>a.status==="ativo");
function pesoAdultoRef(raca){
  if(raca){const ws=ativos().filter(a=>a.raca===raca&&categoria(a)==="Matriz"&&dias(a.nasc)>730).map(a=>ultimo(a.id,"peso")).filter(Boolean).map(p=>p.peso);
    if(ws.length>=3)return ws.reduce((s,v)=>s+v,0)/ws.length}
  if(+S.config.pesoAdulto)return +S.config.pesoAdulto;
  const ws=ativos().filter(a=>categoria(a)==="Matriz"&&dias(a.nasc)>730).map(a=>ultimo(a.id,"peso")).filter(Boolean).map(p=>p.peso);
  return ws.length?ws.reduce((s,v)=>s+v,0)/ws.length:40;
}
function pesoNaIdade(a,alvo,tol){
  const ps=pesagensDe(a.id).filter(p=>p.peso!=null);let best=null,bd=1e9;
  ps.forEach(p=>{const d=Math.abs(idadeEm(a,p.data)-alvo);if(d<=tol&&d<bd){bd=d;best=p}});return best;
}
function gmdNascDesm(a){
  const pn=pesoNaIdade(a,0,3),pdm=pesoNaIdade(a,desmIdade(),16);
  if(!pn||!pdm)return null;const dd=dias(pn.data,pdm.data);return dd>0?(pdm.peso-pn.peso)/dd*1000:null;
}
function gmdUltimo(a){
  const ps=pesagensDe(a.id).filter(p=>p.peso!=null);if(ps.length<2)return null;
  const x=ps[ps.length-2],y=ps[ps.length-1];const dd=dias(x.data,y.data);return dd>0?(y.peso-x.peso)/dd*1000:null;
}
function vermifRecentes(id,d=180){return S.sanidade.filter(s=>s.animal===id&&s.tipo==="vermif"&&dias(s.data)<=d).length}
function criaDesmamadaUltimos(id,diasJanela){
  return criasDe(id).some(c=>{
    const nasc=dias(c.nasc);if(nasc>diasJanela+desmIdade())return false;
    if(c.status==="morto"){return c.dataSaida&&idadeEm(c,c.dataSaida)>=desmIdade()}
    return nasc>=desmIdade()||c.status==="ativo";
  });
}
function partoUltimos(id,d){return criasDe(id).some(c=>dias(c.nasc)<=d)}

/* --------- Decisão: manter ou vender --------- */
const ORD={Descartar:3,Vender:2,Observar:1,Manter:0};
function decidir(a){
  const m=[];const cat=categoria(a);const d=dias(a.nasc);
  const push=(dec,txt,fonte)=>m.push({dec,txt,fonte});
  const defs=(a.defeitos||[]);
  defs.forEach(k=>{const def=DEFEITOS.find(x=>x[0]===k);if(def)push("Descartar",def[1],"alves")});
  const v=vermifRecentes(a.id,180);
  const v12=vermifRecentes(a.id,365);
  if(v>=4)push("Descartar",`Vermifugada ${v} vezes em 6 meses: animal sensível à verminose`,"famacha");
  else if(v12>=4)push("Observar",`Vermifugada ${v12} vezes em 12 meses: com avaliação mensal, o descarte é indicado a partir de 4 doses no ano`,"famacha");
  else if(v===3)push("Observar",`Vermifugada 3 vezes em 6 meses (descarte a partir de 4)`,"famacha");
  const fam=ultimo(a.id,"famacha");
  if(fam&&fam.famacha>=4&&dias(fam.data)<=45)push("Observar",`FAMACHA ${fam.famacha} em ${fd(fam.data)}: tratar e reavaliar em 15 dias`,"verm");
  if(a.idadePor==="dent"&&a.dent==="falha"&&!defs.includes("boca"))push("Descartar","Dentes muito gastos, quebrados ou faltando (aparelho apreensor)","alves");
  if(cat==="Matriz"){
    const ciclo=iepDias(),meses=Math.round(ciclo/30.44);
    if(d>=457+2*ciclo&&!criaDesmamadaUltimos(a.id,2*ciclo))push("Descartar",`Não desmamou cria em 2 ciclos seguidos (${2*meses} meses)`,"alves");
    else if(d>=457+ciclo&&!criaDesmamadaUltimos(a.id,ciclo)){
      if(partoUltimos(a.id,ciclo))push("Observar",`Pariu, mas não desmamou cria no último ciclo (${meses} meses): descarte se falhar de novo`,"alves");
      else push("Observar",`Sem parto no último ciclo (${meses} meses): confirmar prenhez; descarte se falhar 2 ciclos`,"alves");
    }
    const ab=S.sanidade.filter(s=>s.animal===a.id&&s.tipo==="aborto").length;
    if(ab>=2&&!defs.includes("abortos"))push("Descartar",`${ab} abortos registrados`,"alves");
    if(d>=2922)push("Observar",`Idade avançada (${idadeTxt(d)}): com mais de 8 anos, descartar se tiver problema de dentes ou lábios`,"alves");
  }
  if(cat==="Borrega"){
    const ref=pesoAdultoRef(a.raca);const p=ultimo(a.id,"peso");
    if(p&&d>=330&&d<=420&&p.peso<0.5*ref)push("Descartar",`Aos 12 meses pesa ${n1(p.peso)} kg, menos de 50% do peso adulto${a.raca?" da raça":""} (${n1(ref)} kg)`,"alves");
    else if(p&&d>=240&&p.peso>=0.7*ref)push("Manter",`Apta à 1ª cobertura: ${n1(p.peso)} kg, ≥70% do peso adulto`,"cot187");
    if(d>=548&&!criasDe(a.id).length)push("Observar",`Com ${idadeTxt(d)} e sem parto (meta do 1º parto: 13–15 meses): dar a 2ª chance na próxima monta e descartar se falhar`,"monta");
    const g=gmdNascDesm(a);
    if(g!=null&&g<0.75*GMD_META)push("Vender",`Ganho até o desmame de ${n0(g)} g/dia, abaixo de 75% da meta (${GMD_META} g/dia): não reter para reposição`,"cot187");
    else if(g!=null&&g>=GMD_META)push("Manter",`Bom ganho até o desmame (${n0(g)} g/dia): candidata à reposição`,"cot187");
  }
  if(["Cordeiro","Borrego","Capão"].includes(cat)||(cat==="Reprodutor"&&a.castrado)){
    const p=ultimo(a.id,"peso");
    if(cat==="Borrego"&&d>=150&&d<183)push("Observar","Já pode cobrir (puberdade por volta dos 5 meses): separar das fêmeas ou castrar","termin");
    if(p&&p.peso>=META.pesoAbate)push("Vender",`Peso de abate atingido (${n1(p.peso)} kg; meta 28–35 kg)`,"cot187");
    else if(d>=183)push("Vender",`Idade de abate (${idadeTxt(d)}; meta 6–8 meses)`,"cot187");
    const g=gmdNascDesm(a);
    if(g!=null&&g<0.75*GMD_META&&cat!=="Cordeiro")push("Observar",`Ganho até o desmame de ${n0(g)} g/dia, abaixo da meta: avaliar terminação ou venda antecipada`,"cot187");
  }
  if(cat==="Cordeira"||cat==="Cordeiro"){
    const pn=pesoNaIdade(a,0,3);
    if(pn&&pn.peso<2.5)push("Observar",`Nasceu com ${n1(pn.peso)} kg (meta >3 kg): acompanhar de perto nas 3 primeiras semanas`,"barros");
  }
  if(cat==="Reprodutor"&&!a.castrado){
    if(d>=1825)push("Observar",`Reprodutor com ${idadeTxt(d)}: planejar substituição (uso de 3 a 4 anos evita cruzar com as filhas)`,"moraes");
  }
  let dec="Manter";m.forEach(x=>{if(ORD[x.dec]>ORD[dec])dec=x.dec});
  return {dec,motivos:m};
}

/* --------- Agenda de pesagens e FAMACHA --------- */
function chuvoso(d){return (S.config.chuvosos||[]).includes(d.getMonth()+1)}
function agenda(){
  const itens=[];
  ativos().forEach(a=>{
    const d=dias(a.nasc);const cat=categoria(a);
    if(d<=210){
      const marcos=[[0,"Peso ao nascer",0,3],[30,"Pesagem aos 30 dias",7,10],[desmIdade(),"Peso ao desmame",7,14],[120,"Pesagem aos 120 dias",10,15],[180,"Pesagem aos 180 dias (abate)",10,15]];
      let prox=null;
      marcos.forEach(([m,rot,antes,dep])=>{
        const feito=pesoNaIdade(a,m,Math.max(antes,dep));
        if(feito)return;
        const alvo=addD(a.nasc,m);
        if(d>m+dep){if(d-m<60)itens.push({a,rot,alvo,st:"atrasada",tipo:"peso"})}
        else if(d>=m-antes)itens.push({a,rot,alvo,st:"agora",tipo:"peso"});
        else if(!prox)prox={a,rot,alvo,st:"proxima",tipo:"peso"};
      });
      if(prox&&dias(HOJE,prox.alvo)<=21)itens.push(prox);
    }else{
      const p=ultimo(a.id,"peso");
      const lim=90;
      if(!p)itens.push({a,rot:"Pesar (sem registro)",alvo:HOJE,st:"agora",tipo:"peso"});
      else if(dias(p.data)>lim)itens.push({a,rot:"Pesar",alvo:addD(p.data,lim),st:dias(p.data)>lim+30?"atrasada":"agora",tipo:"peso"});
    }
    if(d>=30){
      const intv=d<180?17:(chuvoso(HOJE)?15:30);
      const f=ultimo(a.id,"famacha");
      if(!f)itens.push({a,rot:"FAMACHA (sem avaliação)",alvo:HOJE,st:"agora",tipo:"famacha"});
      else{const dd=dias(f.data);if(dd>=intv)itens.push({a,rot:"FAMACHA",alvo:addD(f.data,intv),st:dd>intv+10?"atrasada":"agora",tipo:"famacha"});
        else if(intv-dd<=7)itens.push({a,rot:"FAMACHA",alvo:addD(f.data,intv),st:"proxima",tipo:"famacha"})}
    }
  });
  return itens;
}

/* --------- Indicadores e diagnóstico --------- */
function indicadores(){
  const at=ativos();const out=[];
  const cats={};at.forEach(a=>{const c=categoria(a);cats[c]=(cats[c]||0)+1});
  const matrizes=at.filter(a=>categoria(a)==="Matriz");
  const repro=at.filter(a=>categoria(a)==="Reprodutor"&&!a.castrado);
  const I=(o)=>out.push(o);
  // 1 reprodutor:matriz
  if(matrizes.length){
    if(!repro.length)I({k:"repro",n:"Matrizes por reprodutor",v:"sem reprodutor",meta:"1 : 25 a 30 a campo; até 1 : 50 em monta controlada",st:"bad",w:2,acao:"Adquira ou separe um reprodutor avaliado (exame andrológico) antes da próxima estação de monta.",f:"monta"});
    else{const r=matrizes.length/repro.length;
      I({k:"repro",n:"Matrizes por reprodutor",v:"1 : "+n0(r),meta:"1 : 25 a 30 a campo; até 1 : 50 em monta controlada",st:r>50?"bad":r>30||r<12?"warn":"good",w:2,
        acao:r>30?"Com monta a campo, use 1 carneiro para 25 a 30 ovelhas. Acima disso, só com monta controlada (até 1 : 50). Inclua outro reprodutor ou divida a monta em lotes.":"Há mais carneiros do que o necessário. Avalie vender um reprodutor e reduzir custos de alimentação.",f:"monta"})}
  }
  // 2 crias por matriz/ano
  const nasc12=S.animais.filter(a=>a.mae&&dias(a.nasc)<=365&&dias(a.nasc)>=0);
  const matAptas=matrizes.filter(a=>dias(a.nasc)>=548);
  if(matAptas.length){const v=nasc12.filter(c=>{const m=byId(c.mae);return m}).length/matAptas.length;
    I({k:"crias",n:"Crias nascidas por matriz no ano",v:n1(v).replace(".",","),meta:"1,3 a 1,6",st:v>=1.3?"good":v>=1?"warn":"bad",w:3,
      acao:"Organize estações de monta de 45–60 dias com intervalo de partos de 8 meses, faça flushing antes da monta e descarte matrizes sem parto.",f:"cot187"})}
  // 2b parição (aproxima a fertilidade)
  const matPar=matrizes.filter(a=>dias(a.nasc)>=457);
  if(matPar.length>=5){const v=matPar.filter(a=>partoUltimos(a.id,365)).length/matPar.length*100;
    I({k:"paricao",n:"Matrizes que pariram nos últimos 12 meses",v:pct(v),meta:"fertilidade de 80 a 90% (adultas)",st:v>=80?"good":v>=65?"warn":"bad",w:2,
      acao:"Confirme a prenhez após a monta, dê reforço alimentar (flushing) antes da cobertura e descarte as matrizes que falham 2 ciclos.",f:"cot187"})}
  // 2c abortos
  if(matPar.length>=5){const ab=S.sanidade.filter(s=>s.tipo==="aborto"&&dias(s.data)<=365).length;const v=ab/matPar.length*100;
    I({k:"aborto",n:"Abortos nos últimos 12 meses",v:pct(v),meta:"3 a 5%",st:v<=5?"good":v<=10?"warn":"bad",w:1,
      acao:"Investigue a causa dos abortos com o veterinário (doenças, manejo, plantas tóxicas) e descarte as matrizes com vários abortos.",f:"cot187"})}
  // 3 mortalidade até 1 ano
  const mortos12=S.animais.filter(a=>a.status==="morto"&&a.dataSaida&&dias(a.dataSaida)<=365);
  const mJov=mortos12.filter(a=>idadeEm(a,a.dataSaida)<365).length;
  if(nasc12.length){const v=mJov/nasc12.length*100;
    I({k:"mort1",n:"Mortalidade de crias (até 1 ano)",v:pct(v),meta:"5 a 10% (aceitável)",st:v<=10?"good":v<=15?"warn":"bad",w:3,
      acao:"Garanta colostro nas primeiras horas, cura do umbigo, aprisco limpo e seco e suplementação das ovelhas nos últimos 50 dias de gestação.",f:"barros"})}
  // 4 mortalidade adultos
  const adultosBase=S.animais.filter(a=>dias(a.nasc)>=365&&(a.status==="ativo"||(a.dataSaida&&dias(a.dataSaida)<=365)));
  if(adultosBase.length){const mA=mortos12.filter(a=>idadeEm(a,a.dataSaida)>=365).length;const v=mA/adultosBase.length*100;
    I({k:"mortA",n:"Mortalidade de adultos",v:pct(v),meta:"3 a 5%",st:v<=5?"good":v<=8?"warn":"bad",w:2,
      acao:"Investigue as causas das mortes (registre na aba Sanidade) e revise o controle de verminose e o calendário de vacinas.",f:"cot187"})}

  if(pns.length>=3){const v=pns.reduce((s,x)=>s+x,0)/pns.length;
    I({k:"pnasc",n:"Peso médio ao nascer",v:n1(v)+" kg",meta:"acima de 3,0 kg",st:v>=3?"good":v>=2.6?"warn":"bad",w:1,

  // 6 peso desmame
  const pds=S.animais.filter(a=>dias(a.nasc)<=500).map(c=>pesoNaIdade(c,desmIdade(),16)).filter(Boolean).map(p=>p.peso);
  if(pds.length>=3){const v=pds.reduce((s,x)=>s+x,0)/pds.length;
    I({k:"pdesm",n:"Peso médio ao desmame",v:n1(v)+" kg",meta:"acima de 12 kg (60–70 dias)",st:v>=12?"good":v>=10?"warn":"bad",w:2,
      acao:"Ofereça creep-feeding (concentrado com 15–20% de proteína bruta) às crias e volumoso de qualidade às matrizes em lactação.",f:"barros"})}
  // 7 GMD
  const gs=S.animais.map(gmdNascDesm).filter(v=>v!=null);
  if(gs.length>=3){const v=gs.reduce((s,x)=>s+x,0)/gs.length;
    I({k:"gmd",n:"Ganho médio diário até o desmame",v:n0(v)+" g/dia",meta:`≥ ${GMD_META} g/dia (derivado: 3 → 12 kg em 70 dias)`,st:v>=GMD_META?"good":v>=0.8*GMD_META?"warn":"bad",w:2,

  if(fams.length>=5){const v=fams.filter(p=>p.famacha>=3).length/fams.length*100;

      acao:"Vermifugue só os animais com grau 3, 4 ou 5, reavalie a cada 15 dias nas chuvas e a cada 30 na seca, e descarte quem precisar de 4 ou mais doses em 6 meses.",f:"famacha"})}

  const cic=iepDias();const matElig=matrizes.filter(a=>dias(a.nasc)>=457+cic);
  if(matElig.length){const imp=matElig.filter(a=>!criaDesmamadaUltimos(a.id,cic)).length;const v=imp/matElig.length*100;
    I({k:"improd",n:`Matrizes sem cria desmamada no último ciclo (${Math.round(cic/30.44)} meses)`,v:`${imp} (${pct(v)})`,meta:"o menor possível; descartar após 2 ciclos sem desmamar",st:v<=5?"good":v<=15?"warn":"bad",w:3,
      acao:"Descarte as matrizes que não desmamam cria em 2 ciclos seguidos. Veja a lista na aba Manter ou vender. Não descarte mais de 30% do rebanho de uma só vez.",f:"alves"})}
  // 10 reposição

    I({k:"repos",n:"Borregas de reposição / matrizes",v:pct(v),meta:"taxa de reposição de 15 a 20% ao ano",st:v>=15?"good":v>=8?"warn":"bad",w:2,
      acao:"Separe as melhores cordeiras (maior ganho, mãe produtiva) para repor 15–20% das matrizes por ano.",f:"cot187"})}
  // 11 matrizes idosas
  if(matrizes.length>=5){const vel=matrizes.filter(a=>dias(a.nasc)>=2922).length;const v=vel/matrizes.length*100;
    I({k:"idosas",n:"Matrizes com 8 anos ou mais",v:pct(v),meta:"≤ 10% (valor prático: com reposição de 15–20% ao ano, a vida útil média é de 5 a 7 anos)",st:v<=10?"good":v<=20?"warn":"bad",w:2,
      acao:"Examine a dentição das matrizes mais velhas e programe a substituição gradual por borregas do próprio rebanho.",f:"alves"})}
  // 13 pesagens em dia
  const ag=agenda();const atras=ag.filter(x=>x.st==="atrasada").length;
  if(at.length){const v=Math.max(0,100-atras/at.length*100);
    I({k:"pes",n:"Controle de pesagens em dia",v:pct(v),meta:"≥ 90% dos animais",st:v>=90?"good":v>=75?"warn":"bad",w:1,
      acao:`Há ${atras} pesagens ou avaliações atrasadas. Use a aba Pesagens para registrar.`,f:"cot187"})}
  // 14 caixa
  const res3=resultadoMeses(3);
  if(S.caixa.length){I({k:"caixa",n:"Resultado do caixa (últimos 3 meses)",v:brl(res3),meta:"positivo",st:res3>=0?"good":"bad",w:2,
    acao:"As saídas superam as entradas. Veja quais categorias mais pesam na aba Caixa e compare o custo da ração com a formulação de menor custo.",f:"cot187"})}
  return {lista:out,cats,matrizes:matrizes.length,repro:repro.length};
}
function resultadoMeses(n){

function nota(lista){
  let s=0,w=0;lista.forEach(i=>{w+=i.w;s+=i.w*(i.st==="good"?1:i.st==="warn"?.5:0)});
  return w?Math.round(s/w*100):null;

  const lactIni=lact.filter(a=>criasDe(a.id).some(c=>c.status==="ativo"&&dias(c.nasc)<=30));

function ringSVG(val,st){
  const r=54,c=2*Math.PI*r,p=val==null?0:val/100;
  const col=st==="good"?"var(--good)":st==="warn"?"var(--warn)":"var(--bad)";
  return `<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Nota ${val??"sem dados"} de 100">
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 66 66)"/>
  <text x="66" y="72" text-anchor="middle" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="36" fill="var(--ink)">${val??"—"}</text>
  <text x="66" y="92" text-anchor="middle" font-size="12" fill="var(--muted)">de 100</text></svg>`;
}
function piramide(){
  const fx=[["0–3 meses",0,91],["3–6 meses",91,183],["6–12 meses",183,365],["1–2 anos",365,730],["2–4 anos",730,1461],["4–6 anos",1461,2191],["6 anos ou mais",2191,99999]];
  const at=ativos();const rows=fx.map(([l,a,b])=>{const g=at.filter(x=>{const d=dias(x.nasc);return d>=a&&d<b});return{l,f:g.filter(x=>x.sexo==="F").length,m:g.filter(x=>x.sexo==="M").length}});
  const max=Math.max(1,...rows.map(r=>Math.max(r.f,r.m)));
  const W=560,lab=110,half=(W-lab)/2-10,rh=26,H=rows.length*rh+30;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Estrutura etária do rebanho por sexo">`;
  s+=`<text x="${half}" y="14" text-anchor="end" font-size="12" fill="var(--fem)" font-weight="700">FÊMEAS</text><text x="${half+lab+20}" y="14" font-size="12" fill="var(--mal)" font-weight="700">MACHOS</text>`;
  rows.forEach((r,i)=>{const y=24+i*rh;const wf=r.f/max*half,wm=r.m/max*half;
    s+=`<rect x="${half-wf}" y="${y}" width="${wf}" height="${rh-8}" rx="3" fill="var(--fem)" opacity=".85"/>`;
    s+=`<rect x="${half+lab+10}" y="${y}" width="${wm}" height="${rh-8}" rx="3" fill="var(--mal)" opacity=".85"/>`;
    s+=`<text x="${half+lab/2+5}" y="${y+13}" text-anchor="middle" font-size="12" fill="var(--ink)">${r.l}</text>`;
    s+=`<text x="${Math.max(18,half-wf-5)}" y="${y+13}" text-anchor="end" font-size="12" fill="var(--muted)" class="num">${r.f}</text>`;
    s+=`<text x="${Math.min(W-14,half+lab+15+wm)}" y="${y+13}" font-size="12" fill="var(--muted)" class="num">${r.m}</text>`;
  });
  return s+"</svg>";
}
function leituraEstrutura(){
  const at=ativos();if(!at.length)return "";
  const jov=at.filter(a=>dias(a.nasc)<365).length/at.length*100;
  const mat=at.filter(a=>categoria(a)==="Matriz");
  const vel=mat.length?mat.filter(a=>dias(a.nasc)>=2922).length/mat.length*100:0;
  const f=at.filter(a=>a.sexo==="F").length,m=at.length-f;
  const t=[];
  t.push(`${n0(jov)}% do rebanho tem menos de 1 ano.`);
  if(jov>55)t.push("É um rebanho com muitos animais novos, comum logo após a parição. Planeje a venda dos machos e a seleção das fêmeas de reposição.");
  else if(jov<25)t.push("Há poucas crias em relação aos adultos. Verifique a fertilidade das matrizes e a mortalidade de cordeiros.");
  if(vel>20)t.push(`${n0(vel)}% das matrizes têm 8 anos ou mais: o rebanho está envelhecendo.`);
  else if(mat.length)t.push(`${n0(vel)}% das matrizes têm 8 anos ou mais.`);
  t.push(`${f} fêmeas e ${m} machos ativos.`);
  return t.join(" ");
}

function analiseEtaria(){
  const at=ativos();const n=at.length;if(!n)return null;
  const anos=a=>dias(a.nasc)/365.25;
  const mat=at.filter(a=>categoria(a)==="Matriz");
  const dec=new Map(at.map(a=>[a.id,decidir(a).dec]));
  const FX=[["Cordeiros (0–3 m)",0,91],["Desmamados (3–6 m)",91,183],["Recria (6–12 m)",183,365],["1 a 2 anos",365,730],["2 a 4 anos",730,1461],["4 a 6 anos",1461,2191],["6 a 8 anos",2191,2922],["8 anos ou mais",2922,1e9]];
  const faixas=FX.map(([l,a,b])=>{const g=at.filter(x=>{const d=dias(x.nasc);return d>=a&&d<b});return{l,f:g.filter(x=>x.sexo==="F").length,m:g.filter(x=>x.sexo==="M").length,t:g.length,dent:g.filter(x=>x.idadePor==="dent").length}});
  const im=mat.map(anos).sort((a,b)=>a-b);
  const media=im.length?im.reduce((s,v)=>s+v,0)/im.length:null;const mediana=im.length?(im.length%2?im[(im.length-1)/2]:(im[im.length/2-1]+im[im.length/2])/2):null;
  const anosMat=[];for(let y=1;y<=9;y++)anosMat.push({l:y<9?`${y} a ${y+1} anos`:"9 anos ou mais",n:mat.filter(a=>{const x=anos(a);return y<9?x>=y&&x<y+1:x>=9}).length,old:y>=8});
  const menos1=mat.filter(a=>anos(a)<1).length;if(menos1)anosMat.unshift({l:"menos de 1 ano",n:menos1,old:false});
  const borr=at.filter(a=>categoria(a)==="Borrega");const borrBoas=borr.filter(a=>!["Vender","Descartar"].includes(dec.get(a.id)));
  const cordeiras=at.filter(a=>categoria(a)==="Cordeira");
  const sairao=mat.filter(a=>dias(a.nasc)>=2922-365||dec.get(a.id)==="Descartar");
  const r1=Math.ceil(mat.length*0.15),r2=Math.ceil(mat.length*0.20);
  const rep=at.filter(a=>categoria(a)==="Reprodutor");const repVelhos=rep.filter(a=>dias(a.nasc)>=1826);
  const machosVenda=at.filter(a=>a.sexo==="M"&&categoria(a)!=="Reprodutor"&&dias(a.nasc)>=desmIdade()&&dec.get(a.id)==="Vender");
  const dT=dietas().find(d=>d.k==="term");const custoMacho=dT&&dT.r.status==="ok"?dT.r.custoKgMS*dT.cmsMed:null;
  const jov=at.filter(a=>dias(a.nasc)<365).length/n*100;
  const vel6=mat.length?mat.filter(a=>anos(a)>=6).length/mat.length*100:0;
  const proj=mat.length-sairao.length+borrBoas.length;
  const I=[];
  if(media!=null)I.push({n:"Idade média das matrizes",v:n1(media)+" anos (mediana "+n1(mediana)+")",meta:"≈ 3 a 5 anos (estimativa do app: 1º parto perto de 1 ano e 3 meses e vida útil de 5 a 7 anos com reposição de 15–20% ao ano)",st:media<=5?"good":media<=6?"warn":"bad",
    acao:media>5?"O rebanho de matrizes está envelhecendo. Aumente a reposição com borregas do próprio rebanho e descarte as ovelhas com dentes gastos ou que falham partos.":"A idade das matrizes está numa faixa produtiva. Mantenha a reposição anual.",f:"alves"});
  if(mat.length)I.push({n:"Matrizes com 6 anos ou mais",v:pct(vel6),meta:"valor prático do app: até 25%",st:vel6<=25?"good":vel6<=40?"warn":"bad",acao:"Examine a dentição dessas ovelhas e programe a troca gradual, começando pelas que criam pior.",f:"dent"});
  if(mat.length>=3)I.push({n:"Reposição: borregas aptas para ficar",v:`${borrBoas.length} (precisa de ${r1} a ${r2} por ano)`,meta:"15 a 20% do número de matrizes por ano",st:borrBoas.length>=r1?"good":borrBoas.length>=Math.ceil(r1/2)?"warn":"bad",
    acao:borrBoas.length<r1?`Separe para reposição as melhores cordeiras (mãe boa criadeira, maior ganho até o desmame). Hoje há ${cordeiras.length} cordeiras mamando que podem entrar na próxima reposição.`:"A reposição está garantida. As borregas que sobrarem podem ser vendidas para reprodução.",f:"cot187"});
  if(mat.length)I.push({n:"Matrizes que devem sair em 12 meses",v:`${sairao.length} (8 anos ou mais em 1 ano, ou indicadas para descarte)`,meta:"coberto pelas borregas de reposição",st:borrBoas.length>=sairao.length?"good":borrBoas.length>=sairao.length/2?"warn":"bad",
    acao:borrBoas.length<sairao.length?`Saem ${sairao.length} e há ${borrBoas.length} borregas para entrar: o número de matrizes vai cair se não houver mais reposição ou compra.`:"As borregas existentes cobrem as saídas previstas.",f:"alves"});
  if(mat.length)I.push({n:"Reprodutores",v:rep.length?`${rep.length} (1 : ${n0(mat.length/rep.length)})${repVelhos.length?`, ${repVelhos.length} com 5 anos ou mais`:""}`:"nenhum",meta:"1 : 25 a 30 a campo; reprodutor com até 5 anos (valor prático)",
    st:!rep.length?"bad":(mat.length/rep.length>50?"bad":mat.length/rep.length>30||repVelhos.length?"warn":"good"),
    acao:!rep.length?"Sem reprodutor ativo cadastrado. Providencie um carneiro avaliado antes da monta.":"Troque o reprodutor antes que as filhas dele entrem na monta, para evitar cruzamento de pai com filha, e faça exame andrológico nos mais velhos.",f:"monta"});
  if(machosVenda.length||at.some(a=>a.sexo==="M"))I.push({n:"Machos desmamados prontos para venda",v:`${machosVenda.length}`+(custoMacho&&machosVenda.length?` · ração ${brl(custoMacho*machosVenda.length)}/dia`:""),meta:"vender com 28 kg ou 6 meses",st:machosVenda.length?"warn":"good",
    acao:machosVenda.length?"Esses animais já atingiram peso ou idade de venda e continuam comendo. Veja a lista em Manter ou vender.":"Nenhum macho passou do ponto de venda.",f:"cot187"});
  I.push({n:"Animais com menos de 1 ano",v:pct(jov),meta:"varia com a época de parição",st:jov>65||jov<20?"warn":"good",acao:jov<20?"Poucas crias para o tamanho do rebanho: confira fertilidade, partos e mortalidade de cordeiros no Painel.":jov>65?"Muitos animais jovens: planeje a venda dos machos e a escolha das fêmeas de reposição antes que pesem no custo.":"Proporção de jovens normal para um rebanho em produção.",f:"cot187"});
  const bad=I.filter(i=>i.st==="bad").length,warn=I.filter(i=>i.st==="warn").length;
  let veredito,st;
  if(media!=null&&media>5.5||vel6>40){veredito="Rebanho de matrizes envelhecido";st="bad"}
  else if(mat.length>=3&&borrBoas.length<r1){veredito="Reposição de matrizes insuficiente";st=borrBoas.length>=Math.ceil(r1/2)?"warn":"bad"}
  else if(jov>65){veredito="Rebanho jovem, com muitas crias";st="warn"}
  else if(bad){veredito="Estrutura com pontos críticos";st="bad"}
  else if(warn){veredito="Estrutura equilibrada, com pontos de atenção";st="warn"}
  else{veredito="Estrutura etária equilibrada";st="good"}
  return{n,faixas,mat,media,mediana,anosMat,borr,borrBoas,cordeiras,sairao,proj,r1,r2,rep,I,veredito,st,dentEst:at.filter(a=>a.idadePor==="dent").length};
}

function resultadoMes(ym){
  const L=S.caixa.filter(c=>c.data.slice(0,7)===ym);
  return{L,e:L.filter(c=>c.tipo==="entrada").reduce((s,c)=>s+ +c.valor,0),s:L.filter(c=>c.tipo==="saida").reduce((s,c)=>s+ +c.valor,0)};
}
function graficoCaixa(n){
  const meses=[];for(let i=n-1;i>=0;i--){const d=new Date(HOJE.getFullYear(),HOJE.getMonth()-i,1);meses.push(iso(d).slice(0,7))}
  const data=meses.map(m=>{const r=resultadoMes(m);return{m,e:r.e,s:r.s}});
  const max=Math.max(100,...data.map(d=>Math.max(d.e,d.s)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;
  const W=520,H=200,l=58,b=24,t=10,cw=(W-l-8)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos ${n} meses">`;
  for(let k=0;k<=4;k++){const v=top*k/4;const y=H-b-(H-b-t)*k/4;s+=`<line x1="${l}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":v}</text>`}
  data.forEach((d,i)=>{const x=l+i*cw+cw*.18;const bw=cw*.3;const he=(H-b-t)*d.e/top,hs=(H-b-t)*d.s/top;
    s+=`<rect x="${x}" y="${H-b-he}" width="${bw}" height="${he}" rx="2" fill="var(--good)"><title>Entradas ${brl(d.e)}</title></rect>`;
    s+=`<rect x="${x+bw+2}" y="${H-b-hs}" width="${bw}" height="${hs}" rx="2" fill="var(--bad)" opacity=".85"><title>Saídas ${brl(d.s)}</title></rect>`;
    s+=`<text x="${x+bw+1}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESES[+d.m.slice(5)-1]}</text>`});
  return s+`</svg><div class="legend"><span><i style="background:var(--good)"></i>Entradas</span><span><i style="background:var(--bad)"></i>Saídas</span></div>`;
}

function simplexMin(c,rows){
  // Simplex em duas fases com regra de Bland (sem Big-M)
  rows=rows.map(r=>r.b<0?{a:r.a.map(v=>-v),op:r.op==="<="?">=":r.op===">="?"<=":"=",b:-r.b}:{...r});
  rows=rows.map(r=>{const sc=Math.max(1,...r.a.map(Math.abs),Math.abs(r.b));return{a:r.a.map(v=>v/sc),op:r.op,b:r.b/sc}});
  const n=c.length,m=rows.length;let nS=0,nA=0;rows.forEach(r=>{if(r.op!=="=")nS++;if(r.op!=="<=")nA++});
  const N=n+nS+nA;const T=[],basis=[];let si=n,ai=n+nS;const art=new Set();
  rows.forEach(r=>{const row=new Array(N+1).fill(0);r.a.forEach((v,j)=>row[j]=v);row[N]=r.b;
    if(r.op==="<="){row[si]=1;basis.push(si);si++}
    else if(r.op===">="){row[si]=-1;si++;row[ai]=1;art.add(ai);basis.push(ai);ai++}
    else{row[ai]=1;art.add(ai);basis.push(ai);ai++}
    T.push(row)});
  const EPS=1e-10;
  const pivot=(r,e)=>{const p=T[r][e];for(let j=0;j<=N;j++)T[r][j]/=p;for(let i=0;i<m;i++)if(i!==r){const f=T[i][e];if(Math.abs(f)>EPS)for(let j=0;j<=N;j++)T[i][j]-=f*T[r][j]}basis[r]=e};
  const run=(cost,allowed)=>{
    for(let it=0;it<5000;it++){
      let e=-1;
      for(let j=0;j<N;j++){if(!allowed(j)||basis.includes(j))continue;let z=0;for(let i=0;i<m;i++)z+=cost[basis[i]]*T[i][j];if(cost[j]-z<-1e-9){e=j;break}}
      if(e<0)return "ok";
      let r=-1,best=Infinity;
      for(let i=0;i<m;i++)if(T[i][e]>1e-9){const q=T[i][N]/T[i][e];if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&basis[i]<basis[r])){best=q;r=i}}
      if(r<0)return "unbounded";
      pivot(r,e);
    }
    return "limit";
  };
  if(nA){
    const c1=new Array(N).fill(0);art.forEach(j=>c1[j]=1);
    run(c1,()=>true);
    let inf=0;basis.forEach((b,i)=>{if(art.has(b))inf+=T[i][N]});
    if(inf>1e-7)return{status:"infeasible"};
    // tira artificiais que ficaram na base com valor zero
    basis.forEach((b,i)=>{if(art.has(b)){for(let j=0;j<n+nS;j++)if(Math.abs(T[i][j])>1e-9){pivot(i,j);break}}});
  }
  const c2=new Array(N).fill(0);c.forEach((v,j)=>c2[j]=v);
  const st=run(c2,j=>!art.has(j));
  if(st==="unbounded")return{status:"unbounded"};
  const x=new Array(N).fill(0);basis.forEach((b,i)=>x[b]=T[i][N]);
  return{status:"ok",x:x.slice(0,n)};
}
/* Formula 1 kg de MS de dieta ao menor custo. req: {pb, ndt, vol, ca, p, soConc} em % da MS. */
function formular(fase,ingr,req,semCaP){
  const I=ingr.filter(g=>g.usar&&+g.ms>0&&+g.preco>0&&!(req.soConc&&g.tipo==="vol"));
  if(!I.length)return{status:"vazio"};
  if(!req.soConc&&+req.vol>0&&!I.some(g=>g.tipo==="vol"))return{status:"semVol"};
  const c=I.map(g=>(+g.preco)/(+g.ms/100));
  const rows=[],tag=[];const add=(a,op,b,t)=>{rows.push({a,op,b});tag.push(t)};
  add(I.map(()=>1),"=",1,"total");
  add(I.map(g=>+g.pb),">=",+req.pb,"proteína");
  add(I.map(g=>+g.ndt||0),">=",+req.ndt,"energia (NDT)");
  if(!req.soConc&&+req.vol>0)add(I.map(g=>g.tipo==="vol"?1:0),">=",+req.vol/100,"mínimo de volumoso");
  add(I.map(g=>(+g.ee||0)-6),"<=",0,"gordura (EE até 6%)");
  if(!semCaP){add(I.map(g=>+g.ca||0),">=",+req.ca,"cálcio");add(I.map(g=>+g.p||0),">=",+req.p,"fósforo")}
  I.forEach((g,j)=>{const a=I.map((_,k)=>k===j?1:0);if(+g.max>0&&+g.max<100)add(a,"<=",+g.max/100,"limite de "+g.nome);if(+g.min>0)add(a.slice(),">=",+g.min/100,"mínimo de "+g.nome)});
  const r=simplexMin(c,rows);
  if(r.status!=="ok"){
    const culp=[];
    [...new Set(tag)].forEach(t=>{if(t==="total")return;const keep=tag.map(x=>x!==t);if(simplexMin(c,rows.filter((_,i)=>keep[i])).status==="ok")culp.push(t)});
    if(!semCaP&&culp.length&&culp.every(t=>t==="cálcio"||t==="fósforo")){const r2=formular(fase,ingr,req,true);if(r2.status==="ok")return r2}
    return{status:"infeasible",diag:culp};
  }
  const x=r.x;
  const linhas=I.map((g,j)=>({g,ms:x[j]})).filter(l=>l.ms>1e-5).sort((a,b)=>({vol:0,conc:1,min:2}[a.g.tipo]-{vol:0,conc:1,min:2}[b.g.tipo])||b.ms-a.ms);
  linhas.forEach(l=>{l.mnKgPorKgMS=l.ms/(l.g.ms/100)});
  const mnTot=linhas.reduce((s,l)=>s+l.mnKgPorKgMS,0);linhas.forEach(l=>l.mn=l.mnKgPorKgMS/mnTot);
  const sum=k=>linhas.reduce((s,l)=>s+l.ms*(+l.g[k]||0),0);
  return{status:"ok",linhas,custoKgMS:linhas.reduce((s,l)=>s+l.ms*(l.g.preco/(l.g.ms/100)),0),pb:sum("pb"),ndt:sum("ndt"),fdn:sum("fdn"),ee:sum("ee"),ca:sum("ca"),p:sum("p"),
    vol:linhas.filter(l=>l.g.tipo==="vol").reduce((s,l)=>s+l.ms,0)*100,mnPorKgMS:mnTot,semCaP:!!semCaP};
}
function msgErroDieta(r){
  if(r.status==="vazio")return "Nenhum alimento marcado com preço. Marque os alimentos que você tem na aba Ingredientes.";
  if(r.status==="semVol")return "Nenhum volumoso marcado. Marque ao menos um volumoso na aba Ingredientes.";
  if(r.status==="infeasible")return "Os alimentos marcados não atendem esta fase"+(r.diag&&r.diag.length?": trava em "+r.diag.join(", "):"")+". Marque um alimento que forneça esse nutriente ou aumente o limite máximo.";

}

const DIETA_CATS=[
  {k:"vazias",n:"Matrizes vazias ou em gestação",fases:["manut","flush","gestI","gestF"],pad:"manut"},
  {k:"lact1",n:"Matrizes em lactação, 1 cria",fases:["lact1","lact2"],pad:"lact1"},

/* ---------- Lotes: cada animal entra sozinho no lote pelo sexo, idade, partos e desmame ---------- */
function lotesCustom(){return Array.isArray(S.racao.lotes)?S.racao.lotes:[]}
function lotesTodos(){return DIETA_CATS.map(c=>({...c,auto:true})).concat(lotesCustom().map(l=>({k:l.k,n:l.n,fases:Object.keys(FASES),pad:FASES[l.fase]?l.fase:"manut",auto:false})))}
function loteInfo(k){return lotesTodos().find(l=>l.k===k)}
function loteAuto(a){
  const D=desmIdade(),d=dias(a.nasc),c=categoria(a);
  if(d<D)return "mamando";
  if(a.sexo==="F"){
    const n=criasDe(a.id).filter(x=>x.status==="ativo"&&dias(x.nasc)<D).length;
    if(n)return n>=2?"lact2":"lact1";
    return c==="Matriz"?"vazias":"borr";

}
function loteDe(a){return a.lote&&loteInfo(a.lote)?a.lote:loteAuto(a)}

  return Object.entries(g).map(([n,b])=>`${b.join(", ")} → ${n}`).join(" · ")}
function faseDe(k){const c=loteInfo(k);if(!c)return "manut";let m=(S.racao.mapa||{})[k];if(FASE_ANTIGA[m])m=FASE_ANTIGA[m];return m&&FASES[m]&&c.fases.includes(m)?m:c.pad}
function cmsCat(k){const v=(S.racao.cms||{})[k];return v&&v>0?+v:FASES[faseDe(k)].cms}
function pctCat(k){const v=(S.racao.pct||{})[k];return v&&v>0?+v:null}
function pesoAtual(a){const p=ultimo(a.id,"peso");return p&&dias(p.data)<=120?p.peso:null}
function cmsAnimal(a,k){const pc=pctCat(k),pv=pesoAtual(a);if(pc&&pv)return pv*pc/100;const v=(S.racao.cms||{})[k];if(v&&v>0)return +v;const F0=FASES[faseDe(k)];const ref=pv||(["vazias","lact1","lact2"].includes(k)||categoria(a)==="Matriz"?pesoAdultoRef(a.raca):null);return F0.pv&&ref?ref*F0.pv/100:F0.cms}
let _dietasCache=null,_dietasSig="";
function dietas(){
  const sig=JSON.stringify([S.racao,ativos().map(a=>a.id+(a.lote||"")).join(),S.animais.length,S.pesagens.length,S.config.idadeDesm]);

  _dietasSig=sig;return _dietasCache;

function kgDia(l,cms){return l.mnKgPorKgMS*cms}

/* ---------- Tratos (manhã / tarde) ---------- */
const TRATOS_PADRAO=[{nome:"Manhã",hora:"07:00",vol:50,conc:50},{nome:"Tarde",hora:"15:30",vol:50,conc:50}];
function tratosCfg(){
  const t=Array.isArray(S.config.tratos)&&S.config.tratos.length?S.config.tratos:TRATOS_PADRAO;
  const sv=t.reduce((s,x)=>s+(+x.vol||0),0)||1,sc=t.reduce((s,x)=>s+(+x.conc||0),0)||1;
  return t.map(x=>({...x,fv:(+x.vol||0)/sv,fc:(+x.conc||0)/sc}));
}
function sobraVol(){const v=S.config.sobra;return 1+((v==null?5:+v)/100)}
function proxTratoIx(){const T=tratosCfg();const now=new Date();const h=now.getHours()*60+now.getMinutes();const i=T.findIndex(t=>{const [hh,mm]=(t.hora||"00:00").split(":").map(Number);return hh*60+mm+90>=h});return i<0?T.length-1:i}

function porTrato(l,cms,t){const tot=kgDia(l,cms)*(l.g.tipo==="vol"?sobraVol():1);return tot*(l.g.tipo==="vol"?t.fv:t.fc)}

    return{d,itens,vol,conc};

  const tot={};lotes.forEach(L=>(L.itens||[]).forEach(i=>{const k=i.l.g.id||i.l.g.nome;tot[k]=tot[k]||{nome:i.l.g.nome,tipo:i.l.g.tipo,kg:0};tot[k].kg+=i.kg}));
  return{T,t,lotes,tot:Object.values(tot).sort((a,b)=>({vol:0,conc:1,min:2}[a.tipo]-{vol:0,conc:1,min:2}[b.tipo])||b.kg-a.kg)};
}

/* Download: usa o recurso do Claude quando existe; no site próprio, baixa direto pelo navegador */
async function baixar(nome,blob,okMsg){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){try{await dl.save({filename:nome,data:blob});toast(okMsg)}catch(e){if(!(e&&e.code==="declined"))toast("Não foi possível gerar o arquivo")}return}
  try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(okMsg)}
  catch(e){toast("Download indisponível nesta visualização")}
}

function vSimular(){
  const F0=FASES[ui.racaoFase];const req=ui.racaoReq&&ui.racaoReq.fase===ui.racaoFase?ui.racaoReq:{fase:ui.racaoFase,cms:F0.cms,pb:F0.pb,ndt:F0.ndt,vol:F0.vol,ca:F0.ca,p:F0.p,soConc:F0.soConc};ui.racaoReq=req;
  const R=ui.racaoRes;let res="";
  if(R){
    if(R.status!=="ok")res=`<div class="res-bad">${esc(msgErroDieta(R))}</div>`;
    else{const cms=+req.cms,q=+ui.racaoQtd||1;const ca=R.custoKgMS*cms;
      res=`<div class="res-ok"><b>Dieta de menor custo:</b> ${brl(R.custoKgMS)} por kg de MS · ${brl(ca)} por animal/dia · ${brl(ca*q*30)} por mês para ${q} animais.</div>
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Alimento</th><th class="r">% MS</th><th class="r">% natural</th><th class="r">kg/animal/dia</th><th class="r">kg/dia (${q})</th></tr></thead><tbody>
      ${R.linhas.map(l=>`<tr><td>${esc(l.g.nome)}</td><td class="r">${n1(l.ms*100)}</td><td class="r">${n1(l.mn*100)}</td><td class="r">${kgDia(l,cms).toLocaleString("pt-BR",{maximumFractionDigits:2})}</td><td class="r">${n1(kgDia(l,cms)*q)}</td></tr>`).join("")}</tbody></table></div>
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Nutriente (% MS)</th><th class="r">Exigência</th><th class="r">Dieta</th></tr></thead><tbody>
      <tr><td>Proteína bruta</td><td class="r">${n1(+req.pb)}</td><td class="r">${n1(R.pb)}</td></tr><tr><td>NDT</td><td class="r">${n1(+req.ndt)}</td><td class="r">${n1(R.ndt)}</td></tr>
      <tr><td>Cálcio</td><td class="r">${(+req.ca).toLocaleString("pt-BR")}</td><td class="r">${R.ca.toLocaleString("pt-BR",{maximumFractionDigits:2})}</td></tr><tr><td>Fósforo</td><td class="r">${(+req.p).toLocaleString("pt-BR")}</td><td class="r">${R.p.toLocaleString("pt-BR",{maximumFractionDigits:2})}</td></tr>
      <tr><td>Volumoso</td><td class="r">≥ ${n0(+req.vol)}</td><td class="r">${n0(R.vol)}</td></tr><tr><td>FDN</td><td class="r">—</td><td class="r">${n0(R.fdn)}</td></tr><tr><td>Gordura (EE)</td><td class="r">≤ 6</td><td class="r">${n1(R.ee)}</td></tr></tbody></table></div>
      ${R.semCaP?`<p class="small" style="color:var(--warn);margin-top:8px">Cálcio e fósforo ficaram abaixo da exigência: inclua calcário, fosfato bicálcico ou sal mineral com Ca e P preenchidos.</p>`:""}`}
  }
  return `<div class="grid g2">
  <section class="panel"><h3>Fase e exigência</h3>
    <div class="form-grid">
      <label class="f" style="grid-column:1/-1">Fase<select id="rFase">${Object.entries(FASES).map(([k,f])=>`<option value="${k}"${k===ui.racaoFase?" selected":""}>${f.n}</option>`).join("")}</select></label>
      <label class="f">Consumo de MS (kg/animal/dia)<input id="rCms" type="number" step="0.05" value="${req.cms}"></label>
      <label class="f">Proteína bruta mínima (% MS)<input id="rPb" type="number" step="0.1" value="${req.pb}"></label>
      <label class="f">NDT mínimo (% MS)<input id="rNdt" type="number" step="0.5" value="${req.ndt}"></label>
      <label class="f">Volumoso mínimo (% MS)<input id="rVol" type="number" step="5" value="${req.vol}"></label>
      <label class="f">Nº de animais<input id="rQtd" type="number" min="1" value="${ui.racaoQtd}"></label>
    </div>
    <p class="small muted" style="margin-top:8px">Exigências desta fase: ${srcLink(F0.f||"nrc85")}. Consumo para ovelha de 50 kg; no rebanho, o app usa ${F0.pv?F0.pv.toString().replace(".",",")+"% do peso vivo de cada animal":"o valor fixo"}. O mínimo de volumoso é um valor prático para a saúde do rúmen; ajuste com seu técnico.</p>
    <div style="margin-top:12px"><button class="btn primary" id="rCalc">Calcular</button></div>
  </section>
  <section class="panel">${res||`<p class="muted">O resultado aparece aqui depois de calcular.</p>`}</section></div>`;
}

let racaoTimer=null;
function salvarRacaoDepois(){_dietasCache=null;clearTimeout(racaoTimer);racaoTimer=setTimeout(()=>save("racao"),600)}
function bindRacao(){
  document.querySelectorAll("[data-rsub]").forEach(b=>b.onclick=()=>{ui.racaoSub=b.dataset.rsub;render()});
  document.querySelectorAll("[data-dfase]").forEach(sel=>sel.onchange=()=>{S.racao.mapa={...(S.racao.mapa||{}),[sel.dataset.dfase]:sel.value};S.racao.cms={...(S.racao.cms||{}),[sel.dataset.dfase]:null};_dietasCache=null;save("racao");render()});
  document.querySelectorAll("[data-dcms]").forEach(inp=>inp.onchange=()=>{S.racao.cms={...(S.racao.cms||{}),[inp.dataset.dcms]:+inp.value||null};_dietasCache=null;save("racao");render()});
  document.querySelectorAll("[data-dpct]").forEach(inp=>inp.onchange=()=>{S.racao.pct={...(S.racao.pct||{}),[inp.dataset.dpct]:+inp.value||null};_dietasCache=null;save("racao");render()});
  if($("#rFase")){
    const readReq=()=>{const F0=FASES[ui.racaoFase];ui.racaoReq={fase:ui.racaoFase,cms:+$("#rCms").value,pb:+$("#rPb").value,ndt:+$("#rNdt").value,vol:+$("#rVol").value,ca:F0.ca,p:F0.p,soConc:F0.soConc};ui.racaoQtd=+$("#rQtd").value||1};
    $("#rFase").onchange=e=>{ui.racaoFase=e.target.value;ui.racaoReq=null;ui.racaoRes=null;render()};
    ["#rCms","#rPb","#rNdt","#rVol","#rQtd"].forEach(s=>$(s).onchange=readReq);
    $("#rCalc").onclick=()=>{readReq();ui.racaoRes=formular(ui.racaoFase,S.racao.ingredientes,ui.racaoReq);render()};
  }
  if($("#rReset"))$("#rReset").onclick=()=>{S.racao.ingredientes=ingPadrao();ui.racaoRes=null;_dietasCache=null;save("racao");render()};
  document.querySelectorAll("tr[data-ing]").forEach(tr=>{
    tr.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=()=>{
      const g=S.racao.ingredientes[+tr.dataset.ing];const f=inp.dataset.f;
      g[f]=f==="usar"?inp.checked:(f==="nome"||f==="tipo")?inp.value:(inp.value===""?null:+inp.value);
      if(f==="preco")delete g.exemplo;
      salvarRacaoDepois();if(f==="usar"||f==="preco"||f==="tipo")render();
    })});
  document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{S.racao.ingredientes.splice(+b.dataset.rdel,1);_dietasCache=null;save("racao");render()});
}
function bibSheet(){
  const tem=new Set(S.racao.ingredientes.map(i=>i.id)),nomes=new Set(S.racao.ingredientes.map(i=>(i.nome||"").toLowerCase()));
  const grupos=[...new Set(BIB.map(b=>b.g))];
  modal(`<h2>Biblioteca de alimentos</h2>
  <p class="small muted">Composição média em % da matéria seca (${esc(F.silva.c)}; CQBAL/UFV; NRC 2001; Embrapa). Marque o que a propriedade tem e informe o <b>preço real por kg</b>. Alimento sem preço entra desmarcado e não é usado nas dietas.</p>
  <input type="search" id="bibq" placeholder="Buscar alimento" aria-label="Buscar alimento" style="width:100%;margin:8px 0">
  <form id="bibf">${grupos.map(g=>`<h3 style="margin-top:12px">${g}</h3><div class="tbl-wrap"><table><thead><tr><th></th><th>Alimento</th><th class="r">R$/kg</th><th class="r">MS</th><th class="r">PB</th><th class="r">NDT</th><th class="r">FDN</th><th class="r">Máx. % MS</th></tr></thead><tbody>
   ${BIB.filter(b=>b.g===g).map(b=>{const ja=tem.has(b.id)||nomes.has(b.nome.toLowerCase());return `<tr data-bibrow="${esc(b.nome.toLowerCase())}"><td><input type="checkbox" id="bib-${b.id}" data-bib="${b.id}" ${ja?"disabled":""} aria-label="Adicionar ${esc(b.nome)}" style="width:auto"></td><td>${esc(b.nome)}${ja?' <span class="pill neutral">já na lista</span>':""}${b.obs?`<br><span class="small muted">${esc(b.obs)}</span>`:""}</td><td class="r"><input type="number" id="bibp-${b.id}" data-bibp="${b.id}" step="0.01" min="0" placeholder="preço" ${ja?"disabled":""}></td><td class="r">${n0(b.ms)}</td><td class="r">${n1(b.pb)}</td><td class="r">${n0(b.ndt)}</td><td class="r">${n0(b.fdn)}</td><td class="r">${b.max}</td></tr>`}).join("")}
   </tbody></table></div>`).join("")}
  <div class="actions"><button type="button" class="btn" data-close="1">Cancelar</button><button type="submit" class="btn primary">Adicionar selecionados</button></div></form>`);
  $("#bibq").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll("[data-bibrow]").forEach(tr=>tr.hidden=!!q&&!tr.dataset.bibrow.includes(q))});
  document.querySelectorAll("[data-bibp]").forEach(inp=>inp.addEventListener("input",()=>{const cb=$("#bib-"+inp.dataset.bibp);if(cb&&inp.value)cb.checked=true}));
  $("#bibf").onsubmit=e=>{e.preventDefault();let n=0,sp=0;
    BIB.forEach(b=>{const cb=$("#bib-"+b.id);if(!cb||!cb.checked)return;const pr=+($("#bibp-"+b.id).value||0);const {g,obs,...base}=b;
      S.racao.ingredientes.push({...base,preco:pr>0?pr:null,usar:pr>0&&!(b.tipo==="min"&&!b.ca&&!b.p),min:0});n++;if(!(pr>0))sp++});
    fechar();if(n){_dietasCache=null;save("racao");render();toast(`${n} alimento(s) adicionado(s)${sp?` · ${sp} sem preço (desmarcado)`:""}`)}};
}

function formLote(ids,modo){
  let L=ids.length?ids.map(byId).filter(Boolean):ativos().filter(a=>dias(a.nasc)>=(modo==="famacha"?30:0));
  L=L.filter(a=>a.status==="ativo").sort((a,b)=>a.brinco.localeCompare(b.brinco,"pt",{numeric:true}));
  const fam=modo==="famacha";
  modal(`<h2>${fam?"FAMACHA em lote":"Pesagem em lote"}</h2>
  <p class="small muted">${L.length} animais. Preencha só o que avaliou; linhas vazias são ignoradas.${ids.length?" Mostrando os que estão com avaliação pendente.":""}${fam?" Grau 3, 4 ou 5 marca a vermifugação automaticamente.":""}</p>
  <form id="fLote"><div class="form-grid" style="margin-bottom:10px"><label class="f">Data<input id="loteData" type="date" value="${iso(HOJE)}"></label></div>
  <div class="tbl-wrap" style="max-height:55vh;overflow:auto"><table><thead><tr><th>Animal</th>${fam?"":`<th class="r">Peso (kg)</th>`}<th>FAMACHA (toque o grau)</th><th>Vermifugar</th></tr></thead><tbody>
  ${L.map(a=>{const u=ultimo(a.id,"peso");return `<tr data-lrow="${a.id}"><td><b>${esc(a.brinco)}</b> <span class="small muted">${categoria(a)}${u?" · "+n1(u.peso)+" kg":""}</span></td>
   ${fam?"":`<td class="r"><input type="number" step="0.1" min="0" data-lk="peso" aria-label="Peso de ${esc(a.brinco)}"></td>`}
   <td><div class="chips gr" data-chips data-clear><input type="hidden" data-lk="famacha">${[1,2,3,4,5].map(v=>`<button type="button" class="chip g${v}" data-chip="${v}" aria-pressed="false" aria-label="Grau ${v} para ${esc(a.brinco)}">${v}</button>`).join("")}</div></td>
   <td><input type="checkbox" data-lk="verm" aria-label="Vermifugar ${esc(a.brinco)}" style="width:auto"></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">Nenhum animal.</td></tr>`}
  </tbody></table></div>
  <div class="actions"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Salvar todos</button></div></form>`);
  $("#fLote").addEventListener("chips",e=>{const tr=e.target.closest("tr");if(!tr)return;const v=+tr.querySelector('[data-lk="famacha"]').value;tr.querySelector('[data-lk="verm"]').checked=v>=3});
  $("#fLote").onsubmit=e=>{e.preventDefault();const data=$("#loteData").value||iso(HOJE);let n=0,v=0;
    document.querySelectorAll("[data-lrow]").forEach(tr=>{const g=k=>{const el=tr.querySelector(`[data-lk="${k}"]`);return el&&el.value!==""?+el.value:null};
      const peso=g("peso"),ecc=g("ecc"),f=g("famacha"),verm=tr.querySelector('[data-lk="verm"]').checked;const an=tr.dataset.lrow;
      if(peso!=null||ecc!=null||f!=null){S.pesagens.push({id:uid(),animal:an,data,peso,ecc,famacha:f});n++}
      if(verm){S.sanidade.push({id:uid(),data,animal:an,tipo:"vermif",desc:"Vermifugação"+(f?" (FAMACHA "+f+")":"")});v++}});
    if(!n&&!v){toast("Nenhum valor preenchido");return}
    save("pesagens");if(v)save("sanidade");fechar();render();toast(`${n} registros salvos${v?`, ${v} vermifugações`:""}`)};
}

function vAbates(){
  const L=abatidos();const u12=L.filter(a=>dias(a.dataSaida)<=365);
  const sum=(arr,f)=>arr.reduce((s,a)=>s+(+f(a)||0),0);
  const pv=sum(u12,a=>a.abate&&a.abate.pv),cq=sum(u12.filter(a=>a.abate&&a.abate.cq),a=>a.abate.cq),pvc=sum(u12.filter(a=>a.abate&&a.abate.cq),a=>a.abate.pv);
  const rend=pvc?cq/pvc*100:null;
  const vCons=sum(u12.filter(a=>a.abate&&a.abate.dest!=="venda"),a=>a.abate.valor),vVenda=sum(u12.filter(a=>a.abate&&a.abate.dest==="venda"),a=>a.abate.valor);
  const porMes={};u12.forEach(a=>{const m=a.dataSaida.slice(0,7);porMes[m]=(porMes[m]||0)+1});
  const st=rend==null?"neutral":rend>=46?"good":rend>=42?"warn":"bad";
  return `<div class="section-head"><div><h2>Abates na fazenda</h2><p class="lead" style="margin:0">Controle dos animais abatidos na propriedade para consumo, venda de carne ou doação. O animal sai do rebanho ativo sem contar como morte.</p></div>
  <button class="btn primary" data-act="abate">+ Abate</button></div>
  <div class="stats" style="margin-bottom:16px">
   <div class="panel stat"><span class="v">${u12.length}</span><span class="l">abates em 12 meses</span></div>
   <div class="panel stat"><span class="v">${n0(pv)} kg</span><span class="l">peso vivo abatido</span></div>
   <div class="panel stat"><span class="v">${cq?n0(cq)+" kg":"—"}</span><span class="l">carcaça quente</span></div>
   <div class="panel stat"><span class="v">${rend==null?"—":n1(rend)+"%"}</span><span class="l">rendimento médio <span class="pill ${st}">${rend==null?"sem dado":rend>=46?"bom":rend>=42?"abaixo":"baixo"}</span></span></div>
   <div class="panel stat"><span class="v">${brl(vCons)}</span><span class="l">consumo próprio (valor de mercado)</span></div>
   <div class="panel stat"><span class="v">${brl(vVenda)}</span><span class="l">venda de carne</span></div>
  </div>
  ${rend!=null&&rend<46?`<div class="banner"><div class="grow"><b>Rendimento abaixo da referência.</b> Cordeiros Morada Nova e Santa Inês terminados renderam 47–49% de carcaça quente. Faça jejum de sólidos antes do abate, abata no peso de 28–35 kg e melhore a terminação. <span class="src">${srcLink("carcaca")}</span></div></div>`:""}
  <section class="panel"><h3>Histórico de abates</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Animal</th><th>Categoria</th><th class="r">Idade</th><th class="r">Peso vivo</th><th class="r">Carcaça</th><th class="r">Rendimento</th><th>Destino</th><th class="r">Valor</th><th></th></tr></thead><tbody>
  ${L.map(a=>{const b=a.abate||{};return `<tr class="click" data-animal="${a.id}"><td>${fd(a.dataSaida)}</td><td><b>${esc(a.brinco)}</b></td><td>${esc(b.cat||"")} ${a.sexo==="F"?"(F)":"(M)"}</td><td class="r">${b.idade!=null?idadeTxt(b.idade):"—"}</td><td class="r">${b.pv?n1(b.pv)+" kg":"—"}</td><td class="r">${b.cq?n1(b.cq)+" kg":"—"}</td><td class="r">${b.pv&&b.cq?n1(b.cq/b.pv*100)+"%":"—"}</td><td>${esc(DEST_AB[b.dest]||"—")}</td><td class="r">${b.valor?brl(b.valor):"—"}</td><td><button class="btn sm" data-desfaz="${a.id}">Desfazer</button></td></tr>`}).join("")||`<tr><td colspan="10" class="empty">Nenhum abate registrado. Use “+ Abate”.</td></tr>`}
  </tbody></table></div>
  <p class="src" style="margin-top:8px">Referência de rendimento: ${srcLink("carcaca")}. Peso e idade de abate: ${srcLink("cot187")}.</p></section>`;
}

function loteFicha(sel){
  const at=ativos();const ag=agenda();
  if(sel==="pendFam")return [...new Set(ag.filter(x=>x.tipo==="famacha"&&x.st!=="proxima").map(x=>x.a))];
  if(sel==="pendPeso")return [...new Set(ag.filter(x=>x.tipo==="peso"&&x.st!=="proxima").map(x=>x.a))];
  if(sel&&sel.startsWith("cat:"))return at.filter(a=>categoria(a)===sel.slice(4));
  if(sel&&sel.startsWith("lote:"))return at.filter(a=>loteDe(a)===sel.slice(5));
  return at;
}

  modal(`<h2>Ficha de campo</h2>

    const extra=Math.max(0,Math.min(60,+$("#fiExtra").value||0));

    for(let i=0;i<(t.animais?extra:Math.max(extra,25));i++)rows.push(t.cols.map(()=>""));

  const prev=()=>{const {t,rows,n}=linhas();$("#fiLoteBox").hidden=!t.animais;
    $("#fiResumo").textContent=t.animais?`${n} animais pré-preenchidos + linhas em branco. Total de ${rows.length} linhas.`:`${rows.length} linhas em branco.`;

  ["#fiTipo","#fiLote","#fiExtra"].forEach(id=>$(id).addEventListener("change",prev));prev();
  $("#fiPdf").onclick=()=>gerarFichaPDF(linhas());

async function gerarFichaPDF({t,rows}){
  if(!window.jspdf||!window.jspdf.jsPDF){toast("Gerador de PDF não carregou. Verifique a conexão e abra de novo.");return}
  const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  if(typeof doc.autoTable!=="function"){toast("Gerador de tabela não carregou. Abra de novo.");return}
  const W=doc.internal.pageSize.getWidth();
  const cab=()=>{doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Ficha de campo: "+t.n,12,13);
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    doc.text("Propriedade: "+(S.config.nome&&MODE!=="demo"?S.config.nome:"______________________________"),12,20);
    doc.text("Data: ____/____/________",W/2-20,20);doc.text("Responsável: ______________________",W-95,20)};
  const usado=t.larg.reduce((s,v)=>s+v,0),livre=W-24-usado;
  const colStyles={};t.larg.forEach((l,i)=>colStyles[i]={cellWidth:l||livre});
  doc.autoTable({head:[t.cols],body:rows,startY:25,margin:{left:12,right:12,top:25},theme:"grid",
    styles:{fontSize:10,minCellHeight:8.5,valign:"middle",lineColor:[90,90,90],lineWidth:0.2,textColor:[20,20,20]},
    headStyles:{fillColor:[225,232,226],textColor:[20,20,20],fontStyle:"bold",fontSize:9},columnStyles:colStyles,
    didDrawPage:d=>{cab();doc.setFontSize(8);doc.setTextColor(110);
      const leg=t.animais?"FAMACHA: 1-2 não tratar; 3, 4 e 5 vermifugar; 5 também suplementar.":"Anote um registro por linha. Natimortos: anotar sem número de cria.";
      doc.text(leg,12,doc.internal.pageSize.getHeight()-6);doc.text("Página "+doc.internal.getNumberOfPages(),W-28,doc.internal.pageSize.getHeight()-6);doc.setTextColor(20)}});
  const blob=doc.output("blob");const nome="ficha-"+Object.keys(FICHAS).find(k=>FICHAS[k]===t)+"-"+iso(HOJE)+".pdf";
  await baixar(nome,blob,"PDF da ficha gerado");
}

const norm=v=>String(v??"").trim();
const semAcento=v=>norm(v).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function dataPlan(v){
  if(v==null||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getFullYear(),v.getMonth(),v.getDate()+(v.getHours()>=12?1:0)));
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*DAY);return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const m=norm(v).match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);if(d.getMonth()===+m[2]-1)return iso(d)}

  return "inválida";
}

function lerPlanilha(arr){

  const hi=M.findIndex(r=>r&&semAcento(r[0]).startsWith("brinco"));
  if(hi<0)throw new Error("Não encontrei a linha de títulos com “Brinco”. Use a planilha modelo do app.");
  const H=M[hi].map(semAcento);const col=k=>H.findIndex(h=>h.startsWith(k));
  const C={brinco:col("brinco"),nome:col("nome"),sexo:col("sexo"),nasc:col("data de nasc"),dent:col("denti"),dentData:col("data da aval"),raca:col("raca"),mae:col("brinco da mae"),origem:col("origem"),cast:col("castrado"),peso:col("peso"),pesoData:col("data da pes"),ecc:col("ecc"),fam:col("famacha"),prob:col("problema"),obs:col("observ")};
  if(C.brinco<0||C.sexo<0)throw new Error("A planilha precisa das colunas Brinco e Sexo.");
  const g=(r,k)=>C[k]>=0?r[C[k]]:null;
  const linhas=[];const vistos=new Set();
  const ativosBr=new Set(ativos().map(a=>semAcento(a.brinco)));
  for(let i=hi+1;i<M.length;i++){const r=M[i];if(!r||r.every(v=>v==null||norm(v)===""))continue;
    const brinco=norm(g(r,"brinco"));if(/^ex-/i.test(brinco))continue;
    const err=[];const o={linha:i+1,brinco};
    if(!brinco)err.push("sem brinco");
    else if(vistos.has(semAcento(brinco)))err.push("brinco repetido na planilha");
    else if(MODE!=="demo"&&ativosBr.has(semAcento(brinco)))err.push("brinco já existe no app");
    vistos.add(semAcento(brinco));
    const sx=semAcento(g(r,"sexo"));o.sexo=sx.startsWith("f")?"F":sx.startsWith("m")?"M":null;if(!o.sexo)err.push("sexo deve ser F ou M");
    o.nome=norm(g(r,"nome"));
    o.nasc=dataPlan(g(r,"nasc"));if(o.nasc==="inválida"){err.push("data de nascimento inválida");o.nasc=null}
    const dTxt=semAcento(g(r,"dent"));
    if(!o.nasc&&dTxt){const d=DENT.find(x=>semAcento(x.n)===dTxt)||DENT.find(x=>dTxt.startsWith(semAcento(x.n).slice(0,8)));
      if(!d)err.push("dentição fora da lista");else{o.dent=d.k;o.dentData=dataPlan(g(r,"dentData"));if(o.dentData==="inválida"){err.push("data da dentição inválida");o.dentData=null}o.dentData=o.dentData||iso(HOJE)}}
    if(!o.nasc&&!o.dent)err.push("informe nascimento ou dentição");
    if(o.nasc&&pd(o.nasc)>HOJE)err.push("nascimento no futuro");
    const rc=norm(g(r,"raca"));o.raca=RACAS_TODAS.find(x=>semAcento(x)===semAcento(rc))||(semAcento(rc)==="srd"?"SRD (sem raça definida)":rc);
    o.mae=norm(g(r,"mae"));
    o.origem=semAcento(g(r,"origem")).startsWith("comp")?"comprado":"nascido";
    o.castrado=o.sexo==="M"&&semAcento(g(r,"cast")).startsWith("s");
    o.peso=numPlan(g(r,"peso"));if(Number.isNaN(o.peso)||(o.peso!=null&&(o.peso<0.5||o.peso>200))){err.push("peso inválido");o.peso=null}
    o.pesoData=dataPlan(g(r,"pesoData"));if(o.pesoData==="inválida"){err.push("data da pesagem inválida");o.pesoData=null}
    o.ecc=null;
    o.fam=numPlan(g(r,"fam"));if(Number.isNaN(o.fam)||(o.fam!=null&&![1,2,3,4,5].includes(o.fam))){err.push("FAMACHA deve ser de 1 a 5");o.fam=null}
    const pt=norm(g(r,"prob"));o.defeitos=[];const naoReconh=[];
    pt.split(/[;\n]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const d=DEFEITOS.find(([k,n])=>semAcento(n)===semAcento(x))||DEFEITOS.find(([k,n])=>semAcento(n).startsWith(semAcento(x).slice(0,10)));if(d)o.defeitos.push(d[0]);else naoReconh.push(x)});
    o.obs=[norm(g(r,"obs")),naoReconh.length?"Problema anotado: "+naoReconh.join("; "):""].filter(Boolean).join(" · ");
    o.err=err;linhas.push(o);
  }
  // mães
  const brOk=new Set(linhas.filter(l=>!l.err.length).map(l=>semAcento(l.brinco)));
  linhas.forEach(l=>{if(l.mae&&!brOk.has(semAcento(l.mae))&&!(MODE!=="demo"&&ativos().some(a=>semAcento(a.brinco)===semAcento(l.mae)))){l.aviso="mãe "+l.mae+" não encontrada: será anotada na observação"}});
  return linhas;
}

      </tbody></table></div>`;
      $("#impOk").hidden=!ok.length;$("#impOk").textContent=`Importar ${ok.length} animais`;
    };rd.readAsArrayBuffer(f)};
  $("#impOk").onclick=()=>{
    const ok=linhas.filter(l=>!l.err.length);if(!ok.length)return;
    if(MODE==="demo"){S={animais:[],pesagens:[],caixa:[],sanidade:[],tarefas:{feitos:{}},config:{...CONFIG_PADRAO,iniciado:true},racao:{ingredientes:ingPadrao()}};MODE=DB?"db":"local";if(DB)try{localStorage.setItem("cn_mode","db")}catch(e){};_dietasCache=null}

      if(l.nasc){a.nasc=l.nasc;a.idadePor="nasc"}else{const d=DENT.find(x=>x.k===l.dent);a.idadePor="dent";a.dent=l.dent;a.dentData=l.dentData;a.nasc=iso(addD(l.dentData,-Math.round(d.m*30.44)))}
      S.animais.push(a);map[semAcento(l.brinco)]=a;
      if(l.peso!=null||l.fam!=null)S.pesagens.push({id:uid(),animal:a.id,data:l.pesoData||iso(HOJE),peso:l.peso,ecc:l.ecc,famacha:l.fam})});
    ok.forEach(l=>{if(!l.mae)return;const a=map[semAcento(l.brinco)];const m=map[semAcento(l.mae)]||ativos().find(x=>semAcento(x.brinco)===semAcento(l.mae)&&x!==a);
      if(m&&m.sexo==="F")a.mae=m.id;else a.obs=[a.obs,"Mãe informada: "+l.mae].filter(Boolean).join(" · ")});
