/* ---------- Ajudantes de gravação ---------- */
function snapshot(ks){const o={};ks.forEach(k=>o[k]=JSON.parse(JSON.stringify(bodyOf(k))));return o}
function desfazer(snap){applyLoaded(snap);_dietasCache=null;save(...Object.keys(snap));render();toast("Registro desfeito")}
function toastUndo(msg,snap){
  let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.innerHTML=`<span>${esc(msg)}</span> <button type="button" class="undo" id="btnUndo">Desfazer</button>`;el.hidden=false;
  $("#btnUndo").onclick=()=>{el.hidden=true;desfazer(snap)};
  clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,7000);
}
const addCaixa=(tipo,cat,desc,valor,data,animais=[])=>S.caixa.push({id:uid(),data,tipo,cat,desc:desc||cat,valor:+valor,animais});
const addSan=(animal,tipo,desc,data)=>S.sanidade.push({id:uid(),data,animal:animal||"",tipo,desc});
const addPes=(animal,data,peso,ecc,famacha)=>S.pesagens.push({id:uid(),animal,data,peso:peso??null,ecc:ecc??null,famacha:famacha??null});
function matarAnimal(a,data,causa){a.status="morto";a.dataSaida=data;a.motivoSaida=causa||"Não informada";addSan(a.id,"morte",a.motivoSaida,data)}
function venderAnimais(L,data){L.forEach(a=>{a.status="vendido";a.dataSaida=data;a.motivoSaida="Venda"})}
function criarCrias(mae,data,crias){
  crias.forEach(c=>{const o={id:uid(),brinco:c.brinco,nome:"",sexo:c.sexo,nasc:data,mae:mae.id,raca:mae.raca||"",origem:"nascido",status:"ativo",castrado:false,defeitos:[],obs:"",idadePor:"nasc"};
    if(c.morta){o.status="morto";o.dataSaida=data;o.motivoSaida="Nasceu morta";addSan(o.id,"morte","Nasceu morta (cria de "+mae.brinco+")",data)}
    S.animais.push(o);if(c.peso)addPes(o.id,data,+c.peso)});
}
function proxBrinco(n=0){const nums=S.animais.map(a=>{const m=String(a.brinco).match(/^C(\d+)$/i);return m?+m[1]:0});return "C"+String(Math.max(0,...nums)+1+n).padStart(3,"0")}
function brKey(b){const s=semAcento(b).replace(/[\s.-]/g,"");const m=s.match(/^([a-z]*)0*(\d+)$/);return m?m[1]+m[2]:s}
function acharAnimal(tok,filtro){const k=brKey(tok);if(!k)return null;return S.animais.find(a=>a.status==="ativo"&&brKey(a.brinco)===k&&(!filtro||filtro(a)))||null}
const ehMatriz=a=>a.sexo==="F"&&dias(a.nasc)>=300;
function datalist(id,L){return `<datalist id="${id}">${L.sort((a,b)=>a.brinco.localeCompare(b.brinco,"pt",{numeric:true})).map(a=>`<option value="${esc(a.brinco)}">${esc(categoria(a))}</option>`).join("")}</datalist>`}
function chipsHtml(opts,sel,attrs=""){return `<div class="chips" data-chips ${attrs}><input type="hidden" value="${esc(sel??"")}">${opts.map(([v,l])=>`<button type="button" class="chip" data-chip="${esc(v)}" aria-pressed="${String(v)===String(sel)}">${esc(l)}</button>`).join("")}</div>`}
const chipVal=sel=>{const g=typeof sel==="string"?$(sel):sel;return g?g.querySelector("input[type=hidden]").value:""};
const chipsMulti=sel=>[...$(sel).querySelectorAll('[data-chip][aria-pressed="true"]')].map(b=>b.dataset.chip);
function animalHint(inp,out,filtro,vazio){const f=()=>{const a=acharAnimal(inp.value,filtro);out.innerHTML=inp.value.trim()?(a?`<span class="pill good">${esc(a.brinco)}</span> ${esc(categoria(a))}, ${idadeTxtA(a)}`:`<span class="pill bad">não encontrado</span> ${esc(vazio||"")}`):""};inp.addEventListener("input",f);f()}

    const u=$("#vdUsar");if(u)u.onclick=()=>{$("#vdVal").value=(kg*precoKg()).toFixed(2)}};

  $("#fVenda").onsubmit=e=>{e.preventDefault();const ids=chipsMulti("#vdA");if(!ids.length){toast("Marque os animais vendidos");return}
    const v=+$("#vdVal").value;if(!(v>0)){toast("Informe o valor recebido");return}
    const data=$("#vdData").value||iso(HOJE);const A=ids.map(byId);const snap=snapshot(["animais","caixa"]);
    venderAnimais(A,data);addCaixa("entrada","Venda de animais",`Venda: ${A.map(a=>a.brinco).join(", ")}${$("#vdQuem").value.trim()?" para "+$("#vdQuem").value.trim():""}`,v,data,ids);
    save("animais","caixa");fechar();render();toastUndo(`Venda de ${A.length} ${A.length>1?"animais":"animal"} salva: ${brl(v)}`,snap)};
}

/* ---------- Gasto ---------- */
function formGasto(pref={}){
  modal(`<h2>Gasto</h2>
  <form id="fGasto">
   <label class="f">Quanto gastou (R$) *<input id="gsVal" type="number" step="0.01" min="0" inputmode="decimal" class="big-input" value="${pref.valor||""}" autofocus></label>
   <p class="lbl" style="margin-top:12px">Com o quê?</p>${chipsHtml(GASTO_CATS,pref.cat||"Ração e concentrado",'id="gsCat"')}
   <div class="form-grid" style="margin-top:12px"><label class="f">Detalhe (opcional)<input id="gsDesc" value="${esc(pref.desc||"")}" placeholder="Ex.: 5 sacos de milho"></label>
   <label class="f">Data<input id="gsData" type="date" value="${pref.data||iso(HOJE)}"></label></div>
  <div class="actions"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Salvar gasto</button></div></form>`);
  setTimeout(()=>{const i=$("#gsVal");if(i)i.focus()},30);
  $("#fGasto").onsubmit=e=>{e.preventDefault();const v=+$("#gsVal").value;if(!(v>0)){toast("Informe o valor");return}
    const cat=chipVal("#gsCat")||"Outras saídas";const data=$("#gsData").value||iso(HOJE);const snap=snapshot(["caixa"]);
    addCaixa("saida",cat,$("#gsDesc").value.trim(),v,data);save("caixa");ui.mesCaixa=data.slice(0,7);fechar();render();toastUndo(`Gasto de ${brl(v)} salvo`,snap)};
}

/* ---------- Vermifugação / vacina ---------- */
function formManejo(pref={}){
  const L=ativos().sort((a,b)=>a.brinco.localeCompare(b.brinco,"pt",{numeric:true})).map(a=>{const f=ultimo(a.id,"famacha");return{a,tag:f&&f.famacha>=3&&dias(f.data)<=30?"FAMACHA "+f.famacha:""}});
  const alvo=pref.animais&&pref.animais.length?"alguns":pref.todos?"todos":"todos";
  modal(`<h2>Vermifugação, vacina ou tratamento</h2>
  <form id="fMan"><p class="lbl">O que foi feito</p>${chipsHtml([["vermif","Vermifugação"],["vacina","Vacina"],["tratamento","Tratamento"]],pref.tipo||"vermif",'id="mnT"')}
  <p class="lbl" style="margin-top:12px">Em quem?</p>${chipsHtml([["todos","Rebanho todo"],["alguns","Só alguns animais"]],alvo,'id="mnAlvo"')}
  <div id="mnBox" style="margin-top:10px">${chipsAnimaisHtml("mnA",L,(pref.animais||[]).map(a=>a.id))}</div>
  <div class="form-grid" style="margin-top:12px"><label class="f">Produto ou vacina<input id="mnProd" value="${esc(pref.prod||"")}" placeholder="Ex.: Clostridioses, Monepantel"></label>
  <label class="f">Data<input id="mnData" type="date" value="${pref.data||iso(HOJE)}"></label></div>
  <p class="small muted" id="mnDica" style="margin-top:8px"></p>
  <div class="actions"><button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`);
  bindBusca("mnA");
  const upd=()=>{$("#mnBox").hidden=chipVal("#mnAlvo")!=="alguns";
    $("#mnDica").textContent=chipVal("#mnT")==="vermif"&&chipVal("#mnAlvo")==="todos"?"No controle pelo FAMACHA, vermifugue só os animais com grau 3, 4 ou 5. Vermifugar o rebanho todo acelera a resistência dos vermes ao remédio.":""};
  $("#mnAlvo").addEventListener("chips",upd);$("#mnT").addEventListener("chips",upd);upd();
  $("#fMan").onsubmit=e=>{e.preventDefault();const tipo=chipVal("#mnT")||"vermif",alv=chipVal("#mnAlvo"),prod=$("#mnProd").value.trim(),data=$("#mnData").value||iso(HOJE);
    const nome=SAN_TIPOS[tipo]+(prod?": "+prod:"");const snap=snapshot(["sanidade"]);let n;
    if(alv==="alguns"){const ids=chipsMulti("#mnA");if(!ids.length){toast("Marque os animais");return}ids.forEach(id=>addSan(id,tipo,nome,data));n=ids.length}
    else{addSan("",tipo,nome+` (rebanho todo, ${ativos().length} animais)`,data);n=ativos().length}
    save("sanidade");fechar();render();toastUndo(`${SAN_TIPOS[tipo]} registrada em ${n} ${n>1?"animais":"animal"}`,snap)};
}

/* ---------- Menu rápido ---------- */
function quickGrid(){return `<div class="quick">${QA.map(([k,t,s,c])=>`<button type="button" class="qbtn q-${c}" data-act="q" data-q="${k}"><b>${t}</b><span>${s}</span></button>`).join("")}</div>`}
function abrirQuick(k){
  const ag=agenda();
  if(k==="parto")formParto();
  else if(k==="famacha"){const ids=[...new Set(ag.filter(x=>x.tipo==="famacha"&&x.st!=="proxima").map(x=>x.a.id))];formLote(ids,"famacha")}
  else if(k==="pesar"){const ids=[...new Set(ag.filter(x=>x.tipo==="peso"&&x.st!=="proxima").map(x=>x.a.id))];formLote(ids,"peso")}
  else if(k==="manejo")formManejo();
  else if(k==="morte")formMorte();
  else if(k==="venda")formVenda();
  else if(k==="abate")formAbate("");
  else if(k==="gasto")formGasto();
  else if(k==="recebi")formLanc("entrada");
}
function formRapido(){
  modal(`<h2>O que aconteceu?</h2>${quickGrid()}
  <div class="actions"><button type="button" class="btn" data-close="1">Fechar</button></div>`);
}

/* ---------- Tela Hoje ---------- */
function vHoje(){
  const TD=tarefasDatadas();const urg=TD.filter(t=>t.d<=HOJE);
  const TR=tratosCfg(),ix=proxTratoIx(),PL=planoTrato(ix);
  const vol=PL.lotes.reduce((s,L)=>s+(L.vol||0),0),conc=PL.lotes.reduce((s,L)=>s+(L.conc||0),0),okT=PL.lotes.filter(L=>feitoChave(chaveTrato(ix,L.d.k))).length;
  const mes=resultadoMes(iso(HOJE).slice(0,7));const custoDia=custoDiaRebanho();
  const prontos=ativos().filter(a=>{const d=decidir(a);return d.dec==="Vender"&&a.sexo==="M"});
  const kgP=prontos.reduce((s,a)=>{const p=ultimo(a.id,"peso");return s+(p?p.peso:0)},0);
  const improd=ativos().filter(a=>categoria(a)==="Matriz"&&decidir(a).motivos.some(m=>/improdutiva|não desmamou/.test(m.txt)));
  const dv=dietas().find(d=>d.k==="vazias");const cpd=dv&&dv.r.status==="ok"?dv.r.custoKgMS*dv.cmsMed:null;
  const {lista}=indicadores();const nt=nota(lista);
  const dn=["domingo","segunda","terça","quarta","quinta","sexta","sábado"][HOJE.getDay()];
  return `<div class="hoje-head"><div><h2>Hoje, ${dn} ${fd(HOJE).slice(0,5)}</h2><p class="muted small" style="margin:0">${ativos().length} animais ativos${nt!=null?` · nota do rebanho <b>${nt}</b>/100`:""}</p></div>
   <button type="button" class="btn" data-act="resumo">Copiar resumo para WhatsApp</button></div>
  <section class="panel" style="margin-bottom:16px"><h3>O que aconteceu?</h3>${quickGrid()}</section>
  <div class="grid g2">
   <section class="panel"><div class="section-head" style="margin-bottom:4px"><h3 style="margin:0">Fazer hoje</h3>${TD.length>urg.length?`<button class="btn sm" data-tab="atividades">Próximos dias (${TD.length-urg.length})</button>`:""}</div>
    ${urg.length?urg.slice(0,7).map(dtaskHtml).join("")+(urg.length>7?`<p class="small muted" style="margin-top:6px">e mais ${urg.length-7} na aba Atividades.</p>`:""):`<p class="muted">Nada pendente. Bom trabalho.</p>`}</section>
   <div class="grid" style="align-content:start">
    <section class="panel"><div class="section-head" style="margin-bottom:6px"><div><span class="small muted">Próximo trato</span><h3 style="margin:0">${esc(TR[ix].nome)} · ${esc(TR[ix].hora||"")}</h3></div><button class="btn primary" data-tab="trato" data-tix="${ix}">Abrir trato</button></div>
     <div class="stats"><div class="stat"><span class="v">${n0(vol)} kg</span><span class="l">volumoso</span></div><div class="stat"><span class="v">${n1(conc)} kg</span><span class="l">concentrado</span></div><div class="stat"><span class="v">${okT} / ${PL.lotes.length}</span><span class="l">lotes tratados</span></div></div></section>
    <section class="panel"><h3>Dinheiro</h3>
     <div class="money"><div><span class="l">Saldo do mês</span><b style="color:${mes.e-mes.s>=0?"var(--good)":"var(--bad)"}">${brl(mes.e-mes.s)}</b><span class="small muted">entrou ${brl(mes.e)} · saiu ${brl(mes.s)}</span></div>
      <div><span class="l">Ração do rebanho</span><b>${brl(custoDia)}/dia</b><span class="small muted">≈ ${brl(custoDia*30)} por mês</span></div></div>
     ${prontos.length?`<div class="lucro good"><b>${prontos.length} ${prontos.length>1?"machos prontos":"macho pronto"} para vender</b> · ≈ ${n0(kgP)} kg vivo, cerca de ${brl(kgP*precoKg())} a ${brl(precoKg())}/kg. Cada dia a mais no cocho custa ração e o ganho de peso cai depois do ponto de abate. <button class="btn sm" data-act="q" data-q="venda">Registrar venda</button></div>`:""}
     ${improd.length?`<div class="lucro bad"><b>${improd.length} ${improd.length>1?"matrizes sem cria":"matriz sem cria"} no último ano</b>${cpd?` · comem cerca de ${brl(improd.length*cpd*30)} por mês sem produzir`:""}. Avalie o descarte. <button class="btn sm" data-tab="decisao">Ver quais</button></div>`:""}
     <p class="src" style="margin-top:8px">Preço do kg vivo usado nas estimativas: ${brl(precoKg())}. Ajuste em Base técnica.</p></section>
   </div>
  </div>`;
}
function textoResumo(){
  const at=ativos();const c={};at.forEach(a=>{const k=categoria(a);c[k]=(c[k]||0)+1});
  const s7=S.animais.filter(a=>a.mae&&dias(a.nasc)<=7&&dias(a.nasc)>=0);
  const m7=S.animais.filter(a=>a.status==="morto"&&a.dataSaida&&dias(a.dataSaida)<=7);
  const v7=S.animais.filter(a=>(a.status==="vendido"||a.status==="abatido")&&a.dataSaida&&dias(a.dataSaida)<=7);
  const mes=resultadoMes(iso(HOJE).slice(0,7));const TD=tarefasDatadas().filter(t=>t.d<=HOJE);
  const {lista}=indicadores();const nt=nota(lista);const crit=lista.filter(i=>i.st==="bad").map(i=>`- ${i.n}: ${i.v} (meta ${i.meta})`);
  return [`*Curral Novo · ${S.config.nome||"Rebanho"}* · ${fd(HOJE)}`,
    `Rebanho: ${at.length} animais (${Object.entries(c).map(([k,v])=>v+" "+k.toLowerCase()+(v>1?"s":"")).join(", ")})`,
    `Últimos 7 dias: ${s7.length} nascimentos, ${m7.length} mortes${m7.length?" ("+m7.map(a=>a.brinco+": "+(a.motivoSaida||"?")).join("; ")+")":""}, ${v7.length} saídas por venda ou abate`,
    `Caixa do mês: entrou ${brl(mes.e)}, saiu ${brl(mes.s)}, saldo ${brl(mes.e-mes.s)}`,
    nt!=null?`Nota do rebanho: ${nt}/100`:"",
    crit.length?"Pontos críticos:\n"+crit.join("\n"):"",
    TD.length?"Pendências: "+TD.slice(0,6).map(t=>t.t).join("; "):""].filter(Boolean).join("\n");
}
function copiarResumo(){
  const t=textoResumo();
  const mostrar=()=>{modal(`<h2>Resumo para enviar</h2><p class="small muted">Copie o texto abaixo e cole no WhatsApp do técnico, do sócio ou da família.</p><textarea id="resTxt" rows="12" readonly>${esc(t)}</textarea><div class="actions"><button type="button" class="btn" data-close="1">Fechar</button></div>`);const x=$("#resTxt");x.focus();x.select()};
  try{navigator.clipboard.writeText(t).then(()=>toast("Resumo copiado. Cole no WhatsApp."),mostrar)}catch(e){mostrar()}
}

/* ---------- Toque em botões de opção (chips) ---------- */
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-chip]");if(!ch)return;
  e.stopImmediatePropagation();e.preventDefault();
  const g=ch.closest("[data-chips]");const multi=g.hasAttribute("data-multi");
  if(multi)ch.setAttribute("aria-pressed",ch.getAttribute("aria-pressed")!=="true");
  else{const on=ch.getAttribute("aria-pressed")==="true";g.querySelectorAll("[data-chip]").forEach(b=>b.setAttribute("aria-pressed",b===ch&&!(on&&g.hasAttribute("data-clear"))));
    const h=g.querySelector("input[type=hidden]");if(h){const p=g.querySelector('[data-chip][aria-pressed="true"]');h.value=p?p.dataset.chip:""}}
  g.dispatchEvent(new Event("chips",{bubbles:true}));
});

/* ===================== Eventos ===================== */
let toastT=null;
function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
document.addEventListener("click",e=>{
  const tx=e.target.closest("[data-tratoix]");if(tx){ui.tratoIx=+tx.dataset.tratoix;render();return}
  const tc=e.target.closest("[data-trat]");if(tc){marcarChave(chaveTrato(+tc.dataset.ix,tc.dataset.trat));return}
  const t=e.target.closest("[data-tab],[data-act],[data-animal],[data-close]");if(!t)return;
  if(t.dataset.close){if(e.target===t||t.tagName==="BUTTON")fechar();return}
  if(t.dataset.tab){if(t.dataset.tix!=null)ui.tratoIx=+t.dataset.tix;ui.tab=t.dataset.tab;try{localStorage.setItem("aprisco_tab",ui.tab)}catch(x){}render();window.scrollTo(0,0);return}
  if(t.dataset.animal){fichaAnimal(t.dataset.animal);return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="sync"){if(!online())toast("Sem internet agora. Seus registros estão guardados e serão enviados sozinhos.");else if(MODE==="cache")toast("Sem conexão com a nuvem. Feche e abra o app com internet para enviar.");else{sincronizar();toast(nPend()?"Enviando registros…":"Tudo sincronizado")}}
  else if(a==="comecar")comecarReal();
  else if(a==="backup")exportarBackup();
  else if(a==="restaurar")importarBackup();
  else if(a==="instalar"){if(window.__instalar){window.__instalar.prompt();window.__instalar=null;render()}}
  else if(a==="rapido")formRapido();
  else if(a==="q"){abrirQuick(t.dataset.q)}
  else if(a==="mais"){ui.mais=!(ui.mais||TABS.slice(TABS_MAIN).some(([k])=>k===ui.tab));if(!ui.mais&&TABS.slice(TABS_MAIN).some(([k])=>k===ui.tab))ui.tab="hoje";render()}
  else if(a==="resumo")copiarResumo();
  else if(a==="novoAnimal")fichaAnimal(null);
  else if(a==="pesar")formPesagem(id||"",t.dataset.tipo);
  else if(a==="lanc")formLanc(t.dataset.tipo);
  else if(a==="evento")formEvento();
  else if(a==="abate")formAbate(id||"");
  else if(a==="ficha")formFicha();
  else if(a==="importar")formImportar();
  else if(a==="modeloPlan")baixarModelo();
  else if(a==="lote")formLote(t.dataset.ids?t.dataset.ids.split(","):[],t.dataset.modo);
  else if(a==="moverLote")formMoverLote(t.dataset.k);
  else if(a==="novoLote")formNovoLote(null);
  else if(a==="editLote")formNovoLote(t.dataset.k);
  else if(a==="tratoView"){ui.tratoView=ui.tratoView==="animais"?"lotes":"animais";render()}
  else if(a==="csvTrato")exportarTrato();
  else if(a==="addIng"){S.racao.ingredientes.push({id:uid(),nome:"Novo ingrediente",tipo:"conc",ms:88,pb:10,ndt:70,fdn:20,ee:3,ca:0.1,p:0.3,preco:null,max:100,min:0,usar:false});_dietasCache=null;save("racao");render()}
  else if(a==="bib")bibSheet();
  else if(a==="delPes")confirmar("Apagar este registro de pesagem?",()=>{S.pesagens=S.pesagens.filter(p=>p.id!==id);save("pesagens")});
  else if(a==="delLanc")confirmar("Apagar este lançamento do caixa? Animais marcados como vendidos continuam vendidos; ajuste na ficha se necessário.",()=>{S.caixa=S.caixa.filter(c=>c.id!==id);save("caixa")});
  else if(a==="delEv")confirmar("Apagar esta ocorrência?",()=>{S.sanidade=S.sanidade.filter(s=>s.id!==id);save("sanidade")});
  else if(a==="delAnimal")confirmar("Apagar este animal e todas as pesagens dele? Para registrar venda ou morte, mude a situação em vez de apagar.",()=>{S.animais=S.animais.filter(x=>x.id!==id);S.pesagens=S.pesagens.filter(p=>p.animal!==id);save("animais","pesagens")});
  else if(a==="salvarCfg"){
    S.config.nome=$("#cNome").value.trim();S.config.idadeDesm=Math.min(120,Math.max(45,+$("#cDesm").value||70));
    S.config.pesoAdulto=$("#cPeso").value?+$("#cPeso").value:null;S.config.precoKg=+$("#cPreco").value||13;S.config.iep=+$("#cIep").value||8;
    S.config.chuvosos=[...document.querySelectorAll("[data-mes]")].filter(x=>x.checked).map(x=>+x.dataset.mes);
    let tr=tratosCfg().map(({fv,fc,...x})=>({...x}));document.querySelectorAll("[data-tr]").forEach(inp=>{const o=tr[+inp.dataset.tr];o[inp.dataset.k]=inp.dataset.k==="vol"||inp.dataset.k==="conc"?+inp.value||0:inp.value});
    const nT=+$("#cNTr").value;while(tr.length<nT)tr.push({nome:["Manhã","Meio-dia","Tarde"][tr.length]||"Trato",hora:"12:00",vol:33,conc:33});tr=tr.slice(0,nT);
    S.config.tratos=tr;S.config.sobra=Math.max(0,Math.min(30,+$("#cSobra").value||0));_dietasCache=null;
    save("config");render();toast(MODE==="demo"?"Ajustes aplicados (modo demonstração)":"Ajustes salvos");
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="busca"){ui.busca=e.target.value;const pos=e.target.selectionStart;render();const b=$("#busca");b.focus();try{b.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.tarefa){marcar(e.target.dataset.freq,e.target.dataset.tarefa);return}
  if(e.target.id==="fStatus"){ui.filtroStatus=e.target.value;render()}
  if(e.target.id==="fCat"){ui.filtroCat=e.target.value;render()}
  if(e.target.id==="fRaca"){ui.filtroRaca=e.target.value;render()}
  if(e.target.id==="mesCaixa"&&e.target.value){ui.mesCaixa=e.target.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalRoot").innerHTML)fechar()});

if(!S.racao.ingredientes)S.racao.ingredientes=ingPadrao();
render();
initStore();
</script>
